<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KAPO ONE</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#070d19;
    color:white;
    min-height:100vh;
}

header{
    background:#0f172a;
    padding:20px;
    text-align:center;
    border-bottom:1px solid #1e293b;
}

header h1{
    margin:0;
    font-size:30px;
}

header p{
    color:#94a3b8;
    margin:8px 0 0;
}

.container{
    width:92%;
    max-width:1100px;
    margin:25px auto;
}

.card{
    background:#0f172a;
    border:1px solid #1e293b;
    border-radius:18px;
    padding:22px;
    margin-bottom:20px;
}

input,
textarea{
    width:100%;
    padding:14px;
    margin:8px 0;
    border:1px solid #334155;
    border-radius:10px;
    background:#020617;
    color:white;
    font-size:16px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 18px;
    margin:5px;
    font-size:15px;
    cursor:pointer;
    background:#2563eb;
    color:white;
}

button:hover{
    opacity:.9;
}

.btn-danger{
    background:#dc2626;
}

.btn-secondary{
    background:#475569;
}

.btn-success{
    background:#16a34a;
}

.hidden{
    display:none !important;
}

.message{
    padding:12px;
    border-radius:10px;
    margin-top:10px;
    background:#172033;
    line-height:1.7;
}

.auth-tabs{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}

.auth-tabs button{
    flex:1;
}

.project-card{
    background:#111827;
    border:1px solid #263449;
    border-radius:18px;
    padding:18px;
    margin-bottom:18px;
}

.project-card img{
    width:100%;
    max-height:350px;
    object-fit:cover;
    border-radius:14px;
    margin-bottom:15px;
}

.project-title{
    font-size:22px;
    font-weight:bold;
    margin-bottom:8px;
}

.project-description{
    color:#cbd5e1;
    line-height:1.8;
    white-space:pre-wrap;
}

.project-date{
    color:#64748b;
    font-size:13px;
    margin-top:10px;
}

.like-box{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-top:15px;
    padding-top:15px;
    border-top:1px solid #263449;
}

.like-btn{
    background:#334155;
}

.like-btn.liked{
    background:#be123c;
}

.like-count{
    color:#cbd5e1;
}

.comments-section{
    margin-top:18px;
    padding-top:18px;
    border-top:1px solid #263449;
}

.comment-item{
    background:#0b1220;
    border:1px solid #263449;
    border-radius:12px;
    padding:14px;
    margin-top:10px;
}

.comment-user{
    font-weight:bold;
    color:#60a5fa;
}

.comment-date{
    color:#64748b;
    font-size:12px;
    margin-top:5px;
}

.comment-content{
    margin-top:10px;
    color:#e2e8f0;
    line-height:1.7;
    white-space:pre-wrap;
}

.user-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.welcome{
    font-size:18px;
    color:#cbd5e1;
}

.empty{
    text-align:center;
    color:#94a3b8;
    padding:30px;
}

footer{
    text-align:center;
    padding:25px;
    color:#64748b;
}

@media(max-width:600px){

    .auth-tabs{
        flex-direction:column;
    }

    .user-top{
        align-items:stretch;
    }

    button{
        width:auto;
    }
}
</style>

</head>

<body>

<header>
    <h1>🚀 KAPO ONE</h1>
    <p>منصة عالمية للأعمال والأفكار والتصاميم</p>
</header>


<!-- =========================
     دخول وتسجيل المستخدم
========================= -->

<div id="userAuth" class="container">

    <div class="card">

        <h2>👤 حساب المستخدم</h2>

        <div class="auth-tabs">

            <button onclick="showLoginForm()">
                🔐 تسجيل الدخول
            </button>

            <button
                class="btn-secondary"
                onclick="showRegisterForm()"
            >
                📝 إنشاء حساب
            </button>

        </div>


        <!-- تسجيل الدخول -->

        <div id="loginForm">

            <input
                id="userLoginEmail"
                type="email"
                placeholder="البريد الإلكتروني"
            >

            <input
                id="userLoginPassword"
                type="password"
                placeholder="كلمة المرور"
            >

            <button onclick="loginUser()">
                دخول
            </button>

            <button
                class="btn-secondary"
                onclick="resetUserPassword()"
            >
                استعادة كلمة المرور
            </button>

        </div>


        <!-- إنشاء الحساب -->

        <div
            id="registerForm"
            class="hidden"
        >

            <input
                id="registerName"
                type="text"
                placeholder="الاسم"
            >

            <input
                id="registerEmail"
                type="email"
                placeholder="البريد الإلكتروني"
            >

            <input
                id="registerPassword"
                type="password"
                placeholder="كلمة المرور"
            >

            <button
                class="btn-success"
                onclick="registerUser()"
            >
                إنشاء الحساب
            </button>

        </div>


        <div id="authMessage"></div>

    </div>

</div>


<!-- =========================
     واجهة المستخدم
========================= -->

<div
    id="userApp"
    class="container hidden"
>

    <div class="card">

        <div class="user-top">

            <div class="welcome">
                👋 مرحبًا
                <strong id="userName"></strong>
            </div>

            <button
                class="btn-danger"
                onclick="logoutUser()"
            >
                🚪 تسجيل الخروج
            </button>

        </div>

    </div>


    <div class="card">

        <h2>🏗️ المشاريع</h2>

        <p style="color:#94a3b8">
            استكشف الأعمال والتصاميم، وأضف إعجابك أو تعليقك.
        </p>

    </div>


    <div id="userProjectsList"></div>

</div>


<footer>
    KAPO ONE © 2026
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://ehmeircigoqfhftaotba.supabase.co";

const SUPABASE_KEY =
"sb_publishable_54N-aEBjhTQK1wUzpWl0fg_MQRq5D-T";

const OWNER_ID =
"dfe5695d-c77a-4ccb-a1eb-901d28169be2";

const SITE_URL =
"https://caapu11-debug.github.io/kapo-one/";


const db =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   تبديل النماذج
========================= */

function showLoginForm(){

    document
    .getElementById("loginForm")
    .classList.remove("hidden");

    document
    .getElementById("registerForm")
    .classList.add("hidden");

    document
    .getElementById("authMessage")
    .innerHTML = "";

}


function showRegisterForm(){

    document
    .getElementById("loginForm")
    .classList.add("hidden");

    document
    .getElementById("registerForm")
    .classList.remove("hidden");

    document
    .getElementById("authMessage")
    .innerHTML = "";

}


/* =========================
   إنشاء مستخدم
========================= */

async function registerUser(){

    const name =
        document
        .getElementById("registerName")
        .value
        .trim();

    const email =
        document
        .getElementById("registerEmail")
        .value
        .trim();

    const password =
        document
        .getElementById("registerPassword")
        .value;

    const message =
        document
        .getElementById("authMessage");


    if(!name || !email || !password){

        message.innerHTML =
        `<div class="message">
            ❌ املأ جميع الخانات.
        </div>`;

        return;
    }


    if(password.length < 6){

        message.innerHTML =
        `<div class="message">
            ❌ كلمة المرور يجب أن تكون 6 أحرف على الأقل.
        </div>`;

        return;
    }


    message.innerHTML =
    `<div class="message">
        جاري إنشاء الحساب...
    </div>`;


    const {data,error} =
        await db.auth.signUp({

            email:email,

            password:password,

            options:{
                data:{
                    name:name
                }
            }

        });


    if(error){

        message.innerHTML =
        `<div class="message">
            ❌ ${escapeHtml(error.message)}
        </div>`;

        return;
    }


    /*
      إذا تم إنشاء المستخدم وتسجيل دخوله مباشرة
      ننشئ ملفه في profiles.
    */

    if(data.user){

        await createProfile(
            data.user,
            name
        );

    }


    /*
      قد تكون خاصية تأكيد البريد مفعلة في Supabase.
    */

    if(!data.session){

        message.innerHTML =
        `<div class="message">
            ✅ تم إنشاء الحساب.
            <br>
            تحقق من بريدك الإلكتروني لتفعيل الحساب،
            ثم سجّل الدخول.
        </div>`;

        return;
    }


    message.innerHTML =
    `<div class="message">
        ✅ تم إنشاء الحساب بنجاح.
    </div>`;


    await loadUserApp(
        data.user
    );

}


/* =========================
   إنشاء Profile
========================= */

async function createProfile(
    user,
    name
){

    if(!user) return;


    const {error} =
        await db
        .from("profiles")
        .upsert({

            id:user.id,

            name:name ||
                 user.user_metadata?.name ||
                 "مستخدم",

            email:user.email

        });


    if(error){

        console.log(
            "Profile error:",
            error.message
        );

    }

}


/* =========================
   تسجيل الدخول
========================= */

async function loginUser(){

    const email =
        document
        .getElementById("userLoginEmail")
        .value
        .trim();

    const password =
        document
        .getElementById("userLoginPassword")
        .value;

    const message =
        document
        .getElementById("authMessage");


    if(!email || !password){

        message.innerHTML =
        `<div class="message">
            ❌ اكتب البريد وكلمة المرور.
        </div>`;

        return;
    }


    message.innerHTML =
    `<div class="message">
        جاري تسجيل الدخول...
    </div>`;


    const {data,error} =
        await db.auth.signInWithPassword({

            email:email,

            password:password

        });


    if(error){

        message.innerHTML =
        `<div class="message">
            ❌ ${escapeHtml(error.message)}
        </div>`;

        return;
    }


    if(
        data.user &&
        data.user.id === OWNER_ID
    ){

        message.innerHTML =
        `<div class="message">
            👑 هذا حساب المالك.
            <br>
            استخدم لوحة المالك.
        </div>`;

        return;
    }


    await createProfile(
        data.user,
        data.user.user_metadata?.name ||
        "مستخدم"
    );


    await loadUserApp(
        data.user
    );

}


/* =========================
   استعادة كلمة المرور
========================= */

async function resetUserPassword(){

    const email =
        document
        .getElementById("userLoginEmail")
        .value
        .trim();

    const message =
        document
        .getElementById("authMessage");


    if(!email){

        message.innerHTML =
        `<div class="message">
            اكتب البريد الإلكتروني أولاً.
        </div>`;

        return;
    }


    const {error} =
        await db.auth.resetPasswordForEmail(
            email,
            {
                redirectTo:SITE_URL
            }
        );


    if(error){

        message.innerHTML =
        `<div class="message">
            ❌ ${escapeHtml(error.message)}
        </div>`;

        return;
    }


    message.innerHTML =
    `<div class="message">
        ✅ تم إرسال رابط الاستعادة إلى بريدك الإلكتروني.
    </div>`;

}


/* =========================
   تشغيل التطبيق
========================= */

async function loadUserApp(user){

    if(!user) return;


    if(user.id === OWNER_ID){

        return;
    }


    document
    .getElementById("userAuth")
    .classList.add("hidden");


    document
    .getElementById("userApp")
    .classList.remove("hidden");


    let name =
        user.user_metadata?.name;


    if(!name){

        const {data} =
            await db
            .from("profiles")
            .select("name")
            .eq(
                "id",
                user.id
            )
            .maybeSingle();

        name =
            data?.name || "مستخدم";

    }


    document
    .getElementById("userName")
    .textContent =
        name;


    await loadUserProjects();

}


/* =========================
   تسجيل خروج المستخدم
========================= */

async function logoutUser(){

    await db.auth.signOut();

    document
    .getElementById("userApp")
    .classList.add("hidden");

    document
    .getElementById("userAuth")
    .classList.remove("hidden");

    showLoginForm();

}


/* =========================
   تحميل المشاريع
========================= */

async function loadUserProjects(){

    const list =
        document
        .getElementById(
            "userProjectsList"
        );


    list.innerHTML =
    `<div class="card">
        جاري تحميل المشاريع...
    </div>`;


    const {data:projects,error} =
        await db
        .from("projects")
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        list.innerHTML =
        `<div class="card message">
            ❌ ${escapeHtml(error.message)}
        </div>`;

        return;
    }


    const {data:likesData} =
        await db
        .from("likes")
        .select(
            "id,project_id,user_id"
        );


    const {data:sessionData} =
        await db.auth.getSession();


    const currentUser =
        sessionData.session?.user;


    if(!projects || !projects.length){

        list.innerHTML =
        `<div class="card empty">
            لا توجد مشاريع منشورة حاليًا.
        </div>`;

        return;
    }


    list.innerHTML =
    projects.map(project => {

        const projectLikes =
            (likesData || [])
            .filter(
                like =>
                like.project_id === project.id
            );


        const likeCount =
            projectLikes.length;


        const isLiked =
            currentUser &&
            projectLikes.some(
                like =>
                like.user_id === currentUser.id
            );


        return `

        <div class="project-card">

            ${
                project.image_url
                ?
                `<img
                    src="${escapeHtml(project.image_url)}"
                    alt="${escapeHtml(project.title)}"
                >`
                :
                ""
            }


            <div class="project-title">
                ${escapeHtml(project.title)}
            </div>


            <div class="project-description">
                ${escapeHtml(
                    project.description || ""
                )}
            </div>


            <div class="project-date">
                ${formatDate(
                    project.created_at
                )}
            </div>


            <div class="like-box">

                <button
                    class="like-btn ${
                        isLiked
                        ?
                        "liked"
                        :
                        ""
                    }"
                    onclick="
                        toggleUserLike(
                            '${project.id}'
                        )
                    "
                >

                    ${
                        isLiked
                        ?
                        "❤️ تم الإعجاب"
                        :
                        "🤍 إعجاب"
                    }

                </button>


                <div class="like-count">

                    ❤️ ${likeCount} إعجاب

                </div>

            </div>


            <div class="comments-section">

                <h3>
                    💬 التعليقات
                </h3>


                <div
                    id="userProjectComments-${project.id}"
                >
                    جاري تحميل التعليقات...
                </div>


                <textarea
                    id="userCommentInput-${project.id}"
                    placeholder="اكتب تعليقك..."
                ></textarea>


                <button
                    class="btn-success"
                    onclick="
                        addUserComment(
                            '${project.id}'
                        )
                    "
                >
                    💬 إضافة تعليق
                </button>

            </div>

        </div>

        `;

    }).join("");


    for(
        const project of projects
    ){

        await loadUserProjectComments(
            project.id
        );

    }

}


/* =========================
   إعجاب المستخدم
========================= */

async function toggleUserLike(
    projectId
){

    const {data:sessionData} =
        await db.auth.getSession();


    const user =
        sessionData.session?.user;


    if(!user){

        alert(
            "يجب تسجيل الدخول أولاً."
        );

        return;
    }


    if(user.id === OWNER_ID){

        return;
    }


    const {data:existing,error:checkError} =
        await db
        .from("likes")
        .select("id")
        .eq(
            "project_id",
            projectId
        )
        .eq(
            "user_id",
            user.id
        )
        .maybeSingle();


    if(checkError){

        alert(
            "خطأ: " +
            checkError.message
        );

        return;
    }


    if(existing){

        const {error} =
            await db
            .from("likes")
            .delete()
            .eq(
                "id",
                existing.id
            );


        if(error){

            alert(
                "خطأ: " +
                error.message
            );

            return;
        }

    }else{

        const {error} =
            await db
            .from("likes")
            .insert({

                project_id:projectId,

                user_id:user.id

            });


        if(error){

            alert(
                "خطأ: " +
                error.message
            );

            return;
        }

    }


    await loadUserProjects();

}


/* =========================
   تعليقات المشروع
========================= */

async function loadUserProjectComments(
    projectId
){

    const box =
        document
        .getElementById(
            `userProjectComments-${projectId}`
        );


    if(!box) return;


    const {data,error} =
        await db
        .from("comments")
        .select(`
            id,
            content,
            created_at,
            user_id,
            profiles(name,email)
        `)
        .eq(
            "project_id",
            projectId
        )
        .order(
            "created_at",
            {
                ascending:true
            }
        );


    if(error){

        box.innerHTML =
        `<div class="message">
            ❌ ${escapeHtml(error.message)}
        </div>`;

        return;
    }


    if(!data || !data.length){

        box.innerHTML =
        `<div style="color:#64748b">
            لا توجد تعليقات حتى الآن.
        </div>`;

        return;
    }


    const {data:sessionData} =
        await db.auth.getSession();


    const currentUser =
        sessionData.session?.user;


    box.innerHTML =
    data.map(comment => {

        const canDelete =
            currentUser &&
            (
                currentUser.id === comment.user_id ||
                currentUser.id === OWNER_ID
            );


        return `

        <div class="comment-item">

            <div class="comment-user">

                👤 ${
                    escapeHtml(
                        comment.profiles?.name ||
                        comment.profiles?.email ||
                        "مستخدم"
                    )
                }

            </div>


            <div class="comment-content">

                ${escapeHtml(
                    comment.content
                )}

            </div>


            <div class="comment-date">

                ${formatDate(
                    comment.created_at
                )}

            </div>


            ${
                canDelete
                ?
                `<button
                    class="btn-danger"
                    onclick="
                        deleteUserComment(
                            '${comment.id}'
                        )
                    "
                >
                    🗑️ حذف
                </button>`
                :
                ""
            }

        </div>

        `;

    }).join("");

}


/* =========================
   إضافة تعليق
========================= */

async function addUserComment(
    projectId
){

    const input =
        document
        .getElementById(
            `userCommentInput-${projectId}`
        );


    if(!input) return;


    const content =
        input.value.trim();


    if(!content){

        alert(
            "اكتب التعليق أولاً."
        );

        return;
    }


    const {data:sessionData} =
        await db.auth.getSession();


    const user =
        sessionData.session?.user;


    if(!user){

        alert(
            "يجب تسجيل الدخول أولاً."
        );

        return;
    }


    const {error} =
        await db
        .from("comments")
        .insert({

            project_id:projectId,

            user_id:user.id,

            content:content

        });


    if(error){

        alert(
            "خطأ في إضافة التعليق: " +
            error.message
        );

        return;
    }


    input.value = "";


    await loadUserProjectComments(
        projectId
    );

}


/* =========================
   حذف تعليق
========================= */

async function deleteUserComment(
    id
){

    if(
        !confirm(
            "هل تريد حذف هذا التعليق؟"
        )
    ){

        return;
    }


    const {data:sessionData} =
        await db.auth.getSession();


    const user =
        sessionData.session?.user;


    if(!user){

        return;
    }


    const {error} =
        await db
        .from("comments")
        .delete()
        .eq(
            "id",
            id
        );


    if(error){

        alert(
            "خطأ: " +
            error.message
        );

        return;
    }


    await loadUserProjects();

}


/* =========================
   أدوات
========================= */

function formatDate(date){

    if(!date) return "";

    try{

        return new Date(date)
        .toLocaleString(
            "ar-SA"
        );

    }catch(e){

        return date;

    }

}


function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }

    return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   فحص الجلسة عند فتح الموقع
========================= */

async function checkUserSession(){

    const {data} =
        await db.auth.getSession();


    const user =
        data.session?.user;


    if(!user){

        document
        .getElementById("userAuth")
        .classList.remove("hidden");

        document
        .getElementById("userApp")
        .classList.add("hidden");

        return;
    }


    if(user.id === OWNER_ID){

        return;
    }


    await createProfile(
        user,
        user.user_metadata?.name ||
        "مستخدم"
    );


    await loadUserApp(
        user
    );

}


checkUserSession();


db.auth.onAuthStateChange(
    async function(
        event,
        session
    ){

        if(
            session &&
            session.user &&
            session.user.id !== OWNER_ID
        ){

            await loadUserApp(
                session.user
            );

        }

    }
);

</script>
