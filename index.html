</style></head><body><header>

</header><div class="container"><div class="card"><h2>

</h2><p class="description">

function analyzeIdea(){

var idea =
document.getElementById("ideaInput").value.trim();

var result =
document.getElementById("result");

if(idea === ""){

result.innerHTML =
"⚠️ اكتب فكرة المشروع أولًا.";

result.style.display="block";

return;

}

var isAtom =
idea.includes("ذرة") ||
idea.includes("ذره") ||
idea.toLowerCase().includes("atom");

if(isAtom){

result.innerHTML =

"<h3>🏗️ تحليل فكرة المشروع</h3>" +

"<div class='green'>" +
"✅ تم تحليل فكرة برج على شكل ذرة"
+
"</div>" +

"<div class='resultBox'>" +
"<strong>🏷️ اسم المشروع</strong><br>" +
"KAPO ATOM | برج كابو الذري" +
"</div>" +

"<div class='resultBox'>" +
"<strong>💡 الفكرة المعمارية</strong><br>" +
"برج مستقبلي مستوحى من شكل الذرة، " +
"حيث تمثل النواة مركز البرج، " +
"وتتوزع الكتل المعمارية حولها بصورة ديناميكية."
+
"</div>" +

"<div class='resultBox'>" +
"<strong>🏢 الاستخدامات المقترحة</strong><br>" +
"فندق، مكاتب، شقق فندقية، مطاعم، " +
"منصة مشاهدة ومساحات للفعاليات."
+
"</div>" +

"<div class='resultBox'>" +
"<strong>🌟 المميزات</strong><br>" +
"شكل معماري مميز، واجهات ديناميكية، " +
"إضاءة ليلية، ومساحات متعددة الاستخدام."
+
"</div>" +

"<div class='resultBox'>" +
"<strong>📐 الخطوة التالية</strong><br>" +
"تحديد ارتفاع البرج، عدد الأدوار، " +
"مساحة الدور ونوع الاستخدام."
+
"</div>";

}else{

result.innerHTML =

"<h3>🏗️ تحليل فكرة المشروع</h3>" +

"<div class='green'>" +
"✅ تم استلام الفكرة بنجاح"
+
"</div>" +

"<div class='resultBox'>" +
"<strong>📌 فكرتك:</strong><br>" +
idea +
"</div>" +

"<div class='resultBox'>" +
"<strong>💡 التصور الأولي:</strong><br>" +
"يمكن تطوير هذه الفكرة إلى مشروع معماري " +
"متكامل من خلال تحديد الشكل والاستخدام " +
"والارتفاع والمساحات."
+
"</div>";

}

result.style.display="block";

result.scrollIntoView({
behavior:"smooth",
block:"start"
});

}

</script></body>
