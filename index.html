<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAPO ONE | كابو ون :🚀</title><style>
body{
margin:0;
background:#0f172a;
color:white;
font-family:Arial,sans-serif;
}

.container{
max-width:800px;
margin:auto;
padding:20px;
}

header{
background:#1e293b;
padding:25px;
border-radius:18px;
text-align:center;
font-size:30px;
font-weight:bold;
}

.box{
margin-top:20px;
background:#1e293b;
padding:25px;
border-radius:18px;
border:2px solid #7c3aed;
}

h2{
text-align:center;
color:#c4b5fd;
}

p{
text-align:center;
color:#cbd5e1;
}

textarea{
width:100%;
height:130px;
padding:15px;
margin-top:15px;
border-radius:12px;
border:0;
font-size:18px;
box-sizing:border-box;
}

button{
width:100%;
padding:18px;
margin-top:15px;
border:0;
border-radius:12px;
background:#7c3aed;
color:white;
font-size:20px;
font-weight:bold;
}

#result{
display:none;
margin-top:20px;
padding:20px;
background:#111827;
border-radius:15px;
line-height:2;
}

.section{
background:#1e293b;
padding:15px;
margin-top:12px;
border-radius:10px;
}

</style></head><body><div class="container"><header>
🚀 KAPO ONE | كابو ون
</header><div class="box"><h2>💡 مولّد فكرة المشروع</h2><p>
اكتب فكرتك هنا ليقوم كابو بتحويلها إلى تصور مشروع.
</p><textarea
id="idea"
placeholder="مثال: برج على شكل ذرة"
></textarea><button
id="analyzeButton"
type="button">
🚀 حلّل الفكرة
</button>

<div id="result"></div></div></div><script>

document.getElementById("analyzeButton").addEventListener("click",function(){

var idea=document.getElementById("idea").value.trim();

var result=document.getElementById("result");

if(idea===""){

result.innerHTML="⚠️ اكتب فكرتك أولًا.";
result.style.display="block";
return;

}

if(
idea.includes("ذرة") ||
idea.includes("ذره")
){

result.innerHTML=

"<h2>🏗️ تحليل فكرة برج الذرة</h2>"+

"<div class='section'>"+
"<strong>🏷️ اسم المشروع</strong><br>"+
"KAPO ATOM | برج كابو الذري"+
"</div>"+

"<div class='section'>"+
"<strong>💡 الفكرة</strong><br>"+
"برج مستقبلي مستوحى من شكل الذرة، "+
"بحيث تمثل النواة مركز البرج، "+
"وتحيط بها كتل معمارية مستوحاة من الإلكترونات."
+
"</div>"+

"<div class='section'>"+
"<strong>🏢 الاستخدامات</strong><br>"+
"مكاتب، فندق، شقق فندقية، مطاعم، "+
"منصة مشاهدة ومساحات للفعاليات."
+
"</div>"+

"<div class='section'>"+
"<strong>🌟 المميزات</strong><br>"+
"شكل معماري مميز، واجهات ديناميكية، "+
"إضاءة ليلية، ومساحات متعددة الاستخدام."
+
"</div>"+

"<div class='section'>"+
"<strong>📐 الخطوة التالية</strong><br>"+
"تحديد ارتفاع البرج، عدد الأدوار، "+
"مساحة الدور ونوع الهيكل الإنشائي."
+
"</div>";

}else{

result.innerHTML=

"<h2>🏗️ تحليل فكرة المشروع</h2>"+

"<div class='section'>"+
"<strong>📌 الفكرة التي أدخلتها:</strong><br>"+
idea+
"</div>"+

"<div class='section'>"+
"✅ تم استلام الفكرة بنجاح."
+
"<br><br>"+
"يمكن لكابو تطويرها إلى تصور معماري "+
"يتضمن الاسم والاستخدامات والمميزات والخطوات الهندسية."
+
"</div>";

}

result.style.display="block";

});

</script></body>
</html>
