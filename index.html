<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>KAPO ONE | كابو ون 🚀</title><style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
}

header{
    background:#1e293b;
    padding:22px 15px;
    text-align:center;
    font-size:30px;
    font-weight:bold;
}

.hero{
    text-align:center;
    padding:35px 20px 20px;
}

.hero h1{
    font-size:30px;
    margin:10px 0;
}

.hero p{
    color:#cbd5e1;
    font-size:17px;
}

.editor{
    max-width:700px;
    margin:25px auto;
    padding:20px;
    background:#1e293b;
    border-radius:18px;
}

textarea{
    width:100%;
    min-height:160px;
    padding:16px;
    border:none;
    border-radius:12px;
    font-size:17px;
    resize:vertical;
    outline:none;
    text-align:right;
    font-family:Arial,sans-serif;
}

button{
    width:100%;
    margin-top:15px;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

#result{
    margin-top:18px;
    padding:15px;
    background:#0f172a;
    border-radius:12px;
    color:#cbd5e1;
    display:none;
}

footer{
    margin-top:40px;
    background:#111827;
    text-align:center;
    padding:18px;
    color:#94a3b8;
}
</style></head><body><header>
🚀 KAPO ONE | كابو ون
</header><section class="hero">
    <h1>مرحبًا بك في كابو ONE</h1>
    <p>اكتب سؤالك أو فكرتك، وابدأ رحلتك مع كابو.</p>
</section><section class="editor"><textarea id="idea" placeholder="اكتب سؤالك أو فكرتك هنا..."></textarea>

<button onclick="sendIdea()">إرسال 🚀</button>

<div id="result"></div>

</section><footer>
© 2026 KAPO ONE
</footer><script>
function sendIdea(){

    const idea = document.getElementById("idea").value.trim();
    const result = document.getElementById("result");

    if(idea === ""){
        result.style.display = "block";
        result.innerHTML = "⚠️ اكتب سؤالك أو فكرتك أولًا.";
        return;
    }

    result.style.display = "block";
    result.innerHTML =
        "✅ تم استلام فكرتك بنجاح!<br><br>" +
        "💡 فكرتك: " + idea;
}
</script></body>
</html>
