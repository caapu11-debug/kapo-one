<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAPO ONE</title><style>
body {
    margin: 0;
    padding: 30px;
    background: #111827;
    color: white;
    font-family: Arial;
    text-align: center;
}

.box {
    max-width: 600px;
    margin: auto;
    background: #1f2937;
    padding: 25px;
    border-radius: 20px;
}

textarea {
    width: 100%;
    height: 120px;
    margin-top: 20px;
    padding: 15px;
    font-size: 18px;
    border-radius: 10px;
    box-sizing: border-box;
}

#analyze {
    width: 100%;
    margin-top: 20px;
    padding: 20px;
    background: #7c3aed;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 22px;
    font-weight: bold;
}

#result {
    margin-top: 20px;
    padding: 20px;
    background: #374151;
    border-radius: 12px;
    display: none;
}
</style></head><body><div class="box"><h1>🚀 KAPO ONE | كابو ون</h1><h2>💡 مولّد فكرة المشروع</h2><p>اكتب فكرتك هنا</p><textarea id="idea" placeholder="مثال: برج على شكل ذرة"></textarea><button id="analyze" type="button">
🚀 حلّل الفكرة
</button><div id="result"></div></div><script>
document.getElementById("analyze").onclick = function() {

    var idea = document.getElementById("idea").value;

    var result = document.getElementById("result");

    if (idea.trim() === "") {
        result.innerHTML = "⚠️ اكتب فكرتك أولًا";
    } else {
        result.innerHTML =
        "✅ تم تحليل فكرتك:<br><br>" +
        idea +
        "<br><br>" +
        "🏗️ كابو جاهز لتطوير هذه الفكرة.";
    }

    result.style.display = "block";
};
</script></body>
</html>
