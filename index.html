<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KAPO ONE</title>

<style>
*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at 50% -10%,#1e3a8a 0,#070d19 38%),
        #070d19;
    color:white;
    min-height:100vh;
}

/* =========================
   HEADER
========================= */

header{
    background:rgba(15,23,42,.92);
    padding:30px 20px;
    text-align:center;
    border-bottom:1px solid rgba(96,165,250,.18);
    box-shadow:0 10px 35px rgba(0,0,0,.25);
}

header h1{
    margin:0;
    font-size:34px;
    font-weight:800;
    letter-spacing:1px;
    background:linear-gradient(90deg,#60a5fa,#a78bfa,#38bdf8);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

header p{
    color:#94a3b8;
    margin:10px 0 0;
    font-size:16px;
}

/* =========================
   CONTAINER
========================= */

.container{
    width:92%;
    max-width:1100px;
    margin:28px auto;
}

/* =========================
   CARDS
========================= */

.card{
    position:relative;
    background:rgba(15,23,42,.84);
    border:1px solid rgba(148,163,184,.14);
    border-radius:22px;
    padding:25px;
    margin-bottom:22px;
    box-shadow:
        0 15px 45px rgba(0,0,0,.22),
        inset 0 1px 0 rgba(255,255,255,.03);
}

.card h2{
    margin-top:0;
    font-size:24px;
}

.card p{
    line-height:1.8;
}

/* =========================
   INPUTS
========================= */

input,
textarea{
    width:100%;
    padding:15px 16px;
    margin:8px 0;
    border:1px solid #334155;
    border-radius:13px;
    background:#020617;
    color:white;
    font-size:16px;
    outline:none;
    transition:.25s;
}

input:focus,
textarea:focus{
    border-color:#3b82f6;
    box-shadow:0 0 0 3px rgba(59,130,246,.12);
}

input::placeholder,
textarea::placeholder{
    color:#64748b;
}

textarea{
    min-height:110px;
    resize:vertical;
}

/* =========================
   BUTTONS
========================= */

button{
    border:0;
    border-radius:12px;
    padding:13px 20px;
    margin:5px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(135deg,#2563eb,#3b82f6);
    color:white;
    box-shadow:0 8px 20px rgba(37,99,235,.18);
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
    opacity:.95;
}

button:active{
    transform:translateY(0);
}

.btn-danger{
    background:linear-gradient(135deg,#dc2626,#ef4444);
}

.btn-secondary{
    background:linear-gradient(135deg,#334155,#475569);
}

.btn-success{
    background:linear-gradient(135deg,#15803d,#22c55e);
}

.hidden{
    display:none !important;
}

/* =========================
   MESSAGE
========================= */

.message{
    padding:14px 16px;
    border-radius:13px;
    margin-top:12px;
    background:rgba(23,32,51,.9);
    border:1px solid #263449;
    line-height:1.8;
}

/* =========================
   AUTH
========================= */

.auth-tabs{
    display:flex;
    gap:10px;
    margin-bottom:17px;
}

.auth-tabs button{
    flex:1;
    margin:0;
}

/* =========================
   PROJECTS
========================= */

.project-card{
    position:relative;
    background:
        linear-gradient(
            145deg,
            rgba(17,24,39,.98),
            rgba(11,18,32,.98)
        );
    border:1px solid rgba(96,165,250,.13);
    border-radius:22px;
    padding:20px;
    margin-bottom:22px;
    overflow:hidden;
    box-shadow:0 18px 45px rgba(0,0,0,.22);
    transition:.25s;
}

.project-card:hover{
    transform:translateY(-3px);
    border-color:rgba(96,165,250,.28);
}

.project-card img{
    width:100%;
    max-height:380px;
    object-fit:cover;
    border-radius:17px;
    margin-bottom:17px;
    display:block;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.project-title{
    font-size:24px;
    font-weight:bold;
    margin-bottom:9px;
    color:#f8fafc;
}

.project-description{
    color:#cbd5e1;
    line-height:1.9;
    white-space:pre-wrap;
}

.project-date{
    color:#64748b;
    font-size:13px;
    margin-top:12px;
}

/* =========================
   LIKES
========================= */

.like-box{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-top:17px;
    padding-top:17px;
    border-top:1px solid #263449;
}

.like-btn{
    background:#334155;
}

.like-btn.liked{
    background:linear-gradient(135deg,#be123c,#e11d48);
}

.like-count{
    color:#cbd5e1;
}

/* =========================
   COMMENTS
========================= */

.comments-section{
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid #263449;
}

.comments-section h3{
    margin-top:0;
}

.comment-item{
    background:rgba(11,18,32,.9);
    border:1px solid #263449;
    border-radius:14px;
    padding:15px;
    margin-top:11px;
}

.comment-user{
    font-weight:bold;
    color:#60a5fa;
}

.comment-date{
    color:#64748b;
    font-size:12px;
    margin-top:6px;
}

.comment-content{
    margin-top:10px;
    color:#e2e8f0;
    line-height:1.8;
    white-space:pre-wrap;
}

/* =========================
   USER
========================= */

.user-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.welcome{
    font-size:19px;
    color:#cbd5e1;
}

.welcome strong{
    color:#60a5fa;
}

/* =========================
   EMPTY
========================= */

.empty{
    text-align:center;
    color:#94a3b8;
    padding:40px 20px;
}

/* =========================
   FOOTER
========================= */

footer{
    text-align:center;
    padding:30px 20px;
    color:#64748b;
    border-top:1px solid rgba(148,163,184,.08);
    margin-top:35px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    header{
        padding:25px 15px;
    }

    header h1{
        font-size:28px;
    }

    header p{
        font-size:14px;
    }

    .container{
        width:94%;
        margin:20px auto;
    }

    .card{
        padding:19px;
        border-radius:18px;
    }

    .project-card{
        padding:15px;
        border-radius:18px;
    }

    .project-title{
        font-size:21px;
    }

    .auth-tabs{
        flex-direction:column;
    }

    .user-top{
        align-items:stretch;
    }

    button{
        padding:12px 16px;
    }
}
</style>

</head>

<body>

<header>
    <h1>🚀 KAPO ONE</h1>
    <p>منصة عالمية للأعمال والأفكار والتصاميم</p>

<!-- =========================
     دخول وتسجيل المستخدم
========================= -->

<div id="userAuth" class="container">

    <div class="card">

        <h2>👤 حساب المستخدم</h2>

            <button
                class="btn-secondary"

        </div>


        <!-- تسجيل الدخول -->

            >

            <button onclick="loginUser()">
                دخول
            </button>

            <button
                class="btn-secondary"
                onclick="resetUserPassword()"
            >
                استعادة كلمة المرور
            </button>

        </div>


        <!-- إنشاء الحساب -->

        <div
            id="registerForm"
            class="hidden"
        >

            <input
                id="registerName"
                type="text"
                placeholder="الاسم"
            >

            <input
                id="registerEmail"
                type="email"
                placeholder="البريد الإلكتروني"
            >

            <input
                id="registerPassword"
                type="password"
                placeholder="كلمة المرور"
            >

            <button
                class="btn-success"
                onclick="registerUser()"
            >
                إنشاء الحساب
            </button>

        </div>


        <div id="authMessage"></div>

    </div>

</div>


<!-- =========================
     واجهة المستخدم
========================= -->

<div
    id="userApp"

>

    <div class="card">

        <div class="user-top">

            <div class="welcome">
                👋 مرحبًا
                <strong id="userName"></strong>
            </div>

            <button
                class="btn-danger"
                onclick="logoutUser()"
            >
                🚪 تسجيل الخروج
            </button>

        </div>

    </div>


    <div class="card">

        <h2>🏗️ المشاريع</h2>

        <p style="color:#94a3b8">
            استكشف الأعمال والتصاميم، وأضف إعجابك أو تعليقك.
        </p>

    </div>


    <div id="userProjectsList"></div>

</div>


<footer>
    KAPO ONE © 2026
</footer>

<script>

const SUPABASE_URL =
"https://ehmeircigoqfhftaotba.supabase.co";

const SUPABASE_KEY =

const OWNER_ID =

const SITE_URL =
"https://caapu11-debug.github.io/kapo-one/";


const db =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   تبديل النماذج
========================= */

function showLoginForm(){

    document
    .getElementById("loginForm")
    .classList.remove("hidden");

    document
    .getElementById("registerForm")
    .classList.add("hidden");

    document
    .getElementById("authMessage")
    .innerHTML = "";

}


function showRegisterForm(){

    document
    .getElementById("loginForm")
    .classList.add("hidden");

    document
    .getElementById("registerForm")
    .classList.remove("hidden");

    document
    .getElementById("authMessage")
    .innerHTML = "";

}


/* =========================
   إنشاء مستخدم
========================= */

async function registerUser(){

    const name =
        document
        .getElementById("registerName")
        .value
        .trim();

    const email =
        document
        .getElementById("registerEmail")
        .value
        .trim();

    const password =
        document
        .getElementById("registerPassword")
        .value;

    const message =
        document
        .getElementById("authMessage");


    if(!name || !email || !password){

        message.innerHTML =
        `<div class="message">
            ❌ املأ جميع الخانات.
        </div>`;

        return;
    }


    if(password.length < 6){

        message.innerHTML =
        `<div class="message">
            ❌ كلمة المرور يجب أن تكون 6 أحرف على الأقل.
        </div>`;

        return;
    }


    message.innerHTML =
    `<div class="message">
        جاري إنشاء الحساب...
    </div>`;


    const {data,error} =
        await db.auth.signUp({

            email:email,

            password:password,

            options:{
                data:{
                    name:name
                }
            }

        });


    if(error){

        message.innerHTML =
        `<div class="message">
            ❌ ${escapeHtml(error.message)}
        </div>`;

        return;
    }


    if(data.user){

        await createProfile(
            data.user,
            name
        );

    }


    if(!data.session){

        message.innerHTML =
        `<div class="message">
            ✅ تم إنشاء الحساب.
            <br>
            تحقق من بريدك الإلكتروني لتفعيل الحساب،
            ثم سجّل الدخول.
        </div>`;

        return;
    }


    message.innerHTML =
    `<div class="message">
        ✅ تم إنشاء الحساب بنجاح.
    </div>`;


    await loadUserApp(
        data.user
    );

}
