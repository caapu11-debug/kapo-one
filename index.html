🚀 KAPO ONE | كابو ون
</header><div class="card"><h2>

</h2><p>
اكتب فكرتك هنا، وسيقوم كابو بتحليلها.

></textarea><button

</button>

<div id="result"></div></div></div><script>

function analyzeIdea(){

    var idea =
    document.getElementById("idea").value.trim();

    if(idea === ""){

        alert("⚠️ اكتب فكرتك أولًا");

        return;
    }

    var result =
    document.getElementById("result");

    var analysis = "";

    if(
        idea.includes("ذرة") ||
        idea.includes("ذره")
    ){

        analysis =
        "<h3>🏗️ تحليل فكرة برج على شكل ذرة</h3>" +

        "<strong>اسم مقترح:</strong><br>" +
        "KAPO ATOM | برج كابو الذري" +

        "<br><br>" +

        "<strong>💡 الفكرة:</strong><br>" +
        "برج مستقبلي مستوحى من تركيب الذرة، " +
        "حيث تمثل النواة مركز البرج وتوزع الكتل المعمارية حولها." +

        "<br><br>" +

        "<strong>🏢 الاستخدامات المقترحة:</strong><br>" +
        "فندق، مكاتب، شقق فندقية، مطاعم، ومنصة مشاهدة." +

        "<br><br>" +

        "<strong>🌟 المميزات:</strong><br>" +
        "شكل معماري مميز، واجهات ديناميكية، إضاءة ليلية، " +
        "ومساحات متعددة الاستخدام.";

    }else{

        analysis =
        "<h3>🏗️ تحليل فكرة المشروع</h3>" +

        "<strong>الفكرة التي أدخلتها:</strong><br>" +
        idea +

        "<br><br>" +

        "✅ يمكن تطوير هذه الفكرة إلى مشروع معماري متكامل." +

        "<br><br>" +

        "📐 الخطوة التالية يمكن أن تكون تحديد " +
        "الارتفاع والمساحة وعدد الأدوار والاستخدام.";

    }

    result.innerHTML = analysis;

    result.style.display = "block";
}

</script></body>
</html>
