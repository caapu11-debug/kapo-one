<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KAPO ONE | تسجيل الدخول</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#070d19;
color:white;
min-height:100vh;
}

header{
background:#0f172a;
padding:16px 20px;
border-bottom:1px solid #263244;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:28px;
font-weight:bold;
}

.logo span{
color:#38bdf8;
}

.home-btn{
background:#1e293b;
color:white;
border:1px solid #334155;
padding:10px 16px;
border-radius:10px;
}

.login-page{
min-height:calc(100vh - 75px);
display:flex;
align-items:center;
justify-content:center;
padding:30px 20px;
}

.login-box{
width:100%;
max-width:450px;
background:#111827;
border:1px solid #263244;
border-radius:22px;
padding:30px;
box-shadow:0 20px 50px rgba(0,0,0,.3);
}

.login-logo{
text-align:center;
font-size:40px;
font-weight:bold;
margin-bottom:5px;
}

.login-logo span{
color:#38bdf8;
}

.login-subtitle{
text-align:center;
color:#94a3b8;
margin-bottom:28px;
line-height:1.7;
}

.tabs{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-bottom:25px;
}

.tab{
padding:13px;
background:#1e293b;
border:1px solid #334155;
color:#cbd5e1;
border-radius:10px;
font-size:16px;
}

.tab.active{
background:#2563eb;
color:white;
border-color:#2563eb;
}

.form-group{
margin-bottom:16px;
}

.form-group label{
display:block;
margin-bottom:8px;
font-size:14px;
color:#cbd5e1;
}

.input{
width:100%;
padding:14px;
background:#07101f;
border:1px solid #334155;
border-radius:11px;
color:white;
font-size:16px;
outline:none;
}

.input:focus{
border-color:#38bdf8;
}

.password-box{
position:relative;
}

.password-box .input{
padding-left:48px;
}

.show-password{
position:absolute;
left:10px;
top:50%;
transform:translateY(-50%);
background:none;
border:0;
color:#94a3b8;
font-size:20px;
}

.forgot{
display:block;
text-align:left;
color:#38bdf8;
font-size:14px;
margin:5px 0 18px;
text-decoration:none;
}

.main-btn{
width:100%;
padding:15px;
border:0;
border-radius:11px;
background:#38bdf8;
color:#082f49;
font-size:17px;
font-weight:bold;
}

.divider{
display:flex;
align-items:center;
gap:10px;
margin:22px 0;
color:#64748b;
font-size:13px;
}

.divider:before,
.divider:after{
content:"";
height:1px;
background:#263244;
flex:1;
}

.social{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.social button{
padding:13px;
border-radius:10px;
background:#1e293b;
border:1px solid #334155;
color:white;
font-size:14px;
}

.notice{
margin-top:20px;
padding:13px;
background:#0b1526;
border-radius:10px;
color:#94a3b8;
font-size:12px;
line-height:1.7;
text-align:center;
}

.register-extra{
display:none;
}

.back{
display:block;
text-align:center;
margin-top:22px;
color:#94a3b8;
font-size:14px;
}

.back span{
color:#38bdf8;
cursor:pointer;
}

.user-menu{
display:none;
position:fixed;
top:75px;
left:15px;
right:15px;
max-width:400px;
margin:auto;
background:#111827;
border:1px solid #334155;
border-radius:15px;
padding:20px;
z-index:50;
}

.user-menu h3{
margin-top:0;
}

.logout{
width:100%;
padding:12px;
background:#7f1d1d;
color:white;
border:0;
border-radius:10px;
margin-top:15px;
}

#message{
display:none;
padding:13px;
border-radius:10px;
margin-bottom:15px;
background:#0b1526;
color:#38bdf8;
text-align:center;
font-size:14px;
}

@media(max-width:500px){

.login-box{
padding:22px;
}

.login-logo{
font-size:34px;
}

.social{
grid-template-columns:1fr;
}

}

</style>

</head>


<body>


<header>

<div class="logo">
KAPO <span>ONE</span>
</div>

<button
class="home-btn"
onclick="goHome()">

← الرئيسية

</button>

</header>


<main class="login-page">


<div class="login-box">


<div class="login-logo">
KAPO <span>ONE</span>
</div>


<div class="login-subtitle">

مرحبًا بك في منصة KAPO ONE<br>

سجّل دخولك أو أنشئ حسابًا جديدًا

</div>


<div class="tabs">

<button
id="loginTab"
class="tab active"
onclick="showLogin()">

تسجيل الدخول

</button>

<button
id="registerTab"
class="tab"
onclick="showRegister()">

إنشاء حساب

</button>

</div>


<div id="message"></div>


<!-- تسجيل الدخول -->

<div id="loginForm">


<div class="form-group">

<label>
البريد الإلكتروني
</label>

<input
id="loginEmail"
class="input"
type="email"
placeholder="example@email.com">

</div>


<div class="form-group">

<label>
كلمة المرور
</label>

<div class="password-box">

<input
id="loginPassword"
class="input"
type="password"
placeholder="أدخل كلمة المرور">

<button
class="show-password"
onclick="togglePassword('loginPassword')">

👁

</button>

</div>

</div>


<a
href="#"
class="forgot"
onclick="forgotPassword();return false;">

نسيت كلمة المرور؟

</a>


<button
class="main-btn"
onclick="loginUser()">

🔐 تسجيل الدخول

</button>


<div class="divider">
أو
</div>


<div class="social">

<button onclick="socialLogin('Google')">
🌐 Google
</button>

<button onclick="socialLogin('Apple')">
 Apple
</button>

</div>


</div>


<!-- إنشاء الحساب -->

<div
id="registerForm"
style="display:none;">


<div class="form-group">

<label>
اسم المستخدم
</label>

<input
id="registerName"
class="input"
type="text"
placeholder="اكتب اسمك">

</div>


<div class="form-group">

<label>
البريد الإلكتروني
</label>

<input
id="registerEmail"
class="input"
type="email"
placeholder="example@email.com">

</div>


<div class="form-group">

<label>
كلمة المرور
</label>

<div class="password-box">

<input
id="registerPassword"
class="input"
type="password"
placeholder="أنشئ كلمة مرور">

<button
class="show-password"
onclick="togglePassword('registerPassword')">

👁

</button>

</div>

</div>


<div class="form-group">

<label>
تأكيد كلمة المرور
</label>

<input
id="registerConfirm"
class="input"
type="password"
placeholder="أعد كتابة كلمة المرور">

</div>


<button
class="main-btn"
onclick="registerUser()">

🚀 إنشاء الحساب

</button>


<div class="notice">

بإنشاء حساب في KAPO ONE أنت توافق على شروط
استخدام المنصة وسياسة الخصوصية.

</div>


</div>


<div class="back">

يمكنك الدخول لاحقًا وربط الحساب الحقيقي
بقاعدة البيانات.

</div>


</div>

</main>


<div
id="userMenu"
class="user-menu">

<h3>
👤 تم تسجيل الدخول
</h3>

<p id="welcomeUser"></p>

<button
class="logout"
onclick="logoutUser()">

تسجيل الخروج

</button>

</div>


<script>


function showLogin(){

document.getElementById("loginForm")
.style.display="block";

document.getElementById("registerForm")
.style.display="none";

document.getElementById("loginTab")
.classList.add("active");

document.getElementById("registerTab")
.classList.remove("active");

clearMessage();

}


function showRegister(){

document.getElementById("loginForm")
.style.display="none";

document.getElementById("registerForm")
.style.display="block";

document.getElementById("loginTab")
.classList.remove("active");

document.getElementById("registerTab")
.classList.add("active");

clearMessage();

}


function togglePassword(id){

let input=
document.getElementById(id);

if(input.type==="password"){

input.type="text";

}else{

input.type="password";

}

}


function showMessage(text){

let box=
document.getElementById("message");

box.innerText=text;

box.style.display="block";

}


function clearMessage(){

document.getElementById("message")
.style.display="none";

}


function registerUser(){

let name=
document.getElementById("registerName")
.value.trim();

let email=
document.getElementById("registerEmail")
.value.trim();

let password=
document.getElementById("registerPassword")
.value;

let confirm=
document.getElementById("registerConfirm")
.value;


if(
name==="" ||
email==="" ||
password==="" ||
confirm===""
){

showMessage(
"يرجى تعبئة جميع البيانات."
);

return;

}


if(password.length<6){

showMessage(
"كلمة المرور يجب أن تكون 6 أحرف على الأقل."
);

return;

}


if(password!==confirm){

showMessage(
"كلمتا المرور غير متطابقتين."
);

return;

}


localStorage.setItem(
"kapoUserName",
name
);

localStorage.setItem(
"kapoUserEmail",
email
);

localStorage.setItem(
"kapoLoggedIn",
"true"
);


showMessage(
"🎉 تم إنشاء الحساب بنجاح!"
);


setTimeout(function(){

goProfile();

},1000);

}


function loginUser(){

let email=
document.getElementById("loginEmail")
.value.trim();

let password=
document.getElementById("loginPassword")
.value;


if(email==="" || password===""){

showMessage(
"أدخل البريد الإلكتروني وكلمة المرور."
);

return;

}


let savedEmail=
localStorage.getItem("kapoUserEmail");


if(
savedEmail &&
email!==savedEmail
){

showMessage(
"البريد الإلكتروني غير مطابق للحساب التجريبي."
);

return;

}


localStorage.setItem(
"kapoLoggedIn",
"true"
);


showMessage(
"✅ تم تسجيل الدخول بنجاح."
);


setTimeout(function(){

goProfile();

},1000);

}


function forgotPassword(){

showMessage(
"سيتم تفعيل استعادة كلمة المرور عند ربط KAPO ONE بالمصادقة الحقيقية."
);

}


function socialLogin(provider){

showMessage(
"تسجيل الدخول بواسطة "+provider+
" سيتم تفعيله عند ربط Supabase Auth."
);

}


function goProfile(){

window.location.href="index.html";

}


function goHome(){

window.location.href="index.html";

}


function logoutUser(){

localStorage.removeItem("kapoLoggedIn");

document.getElementById("userMenu")
.style.display="none";

showMessage(
"تم تسجيل الخروج."
);

}


</script>


</body>

</html>
