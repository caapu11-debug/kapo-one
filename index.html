<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KAPO ONE | إدارة المشاريع</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
}

header{
    background:#1e293b;
    padding:22px 15px;
    text-align:center;
    border-bottom:1px solid #334155;
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:#38bdf8;
}

.subtitle{
    margin-top:7px;
    color:#cbd5e1;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:25px 18px 100px;
}

.back{
    background:#334155;
    margin-bottom:20px;
}

.back:hover{
    background:#475569;
}

.section{
    background:#1e293b;
    padding:22px;
    border-radius:18px;
    border:1px solid #334155;
    margin-bottom:22px;
}

.section h1,
.section h2{
    margin-top:0;
}

input,
textarea,
select{
    width:100%;
    padding:14px;
    margin:8px 0 14px;
    border:1px solid #475569;
    border-radius:10px;
    background:#0f172a;
    color:white;
    font-size:16px;
}

textarea{
    min-height:110px;
    resize:vertical;
}

button{
    border:none;
    border-radius:10px;
    padding:13px 18px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.project{
    background:#111827;
    padding:20px;
    border-radius:15px;
    border:1px solid #334155;
    margin-top:15px;
}

.project h3{
    color:#38bdf8;
    margin-top:0;
}

.project p{
    color:#cbd5e1;
    line-height:1.7;
}

.status{
    display:inline-block;
    padding:7px 12px;
    border-radius:20px;
    background:#334155;
    margin-bottom:12px;
}

.delete{
    background:#b91c1c;
    margin-top:10px;
}

.delete:hover{
    background:#991b1b;
}

.empty{
    color:#94a3b8;
    text-align:center;
    padding:20px;
}

footer{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#111827;
    border-top:1px solid #334155;
    display:flex;
    justify-content:space-around;
    padding:12px;
}

footer button{
    background:transparent;
    color:#cbd5e1;
    padding:6px 12px;
}

footer button:hover{
    background:transparent;
    color:#38bdf8;
}
</style>
</head>

<body>

<header>
    <div class="logo">🚀 KAPO ONE</div>
    <div class="subtitle">👑 لوحة المالك | إدارة المشاريع</div>
</header>

<div class="container">

    <button class="back" onclick="goHome()">
        ← العودة إلى لوحة المالك
    </button>

    <div class="section">
        <h1>🏢 إدارة المشاريع</h1>
        <p>أضف مشاريعك المعمارية والهندسية ونظّمها من مكان واحد.</p>
    </div>

    <div class="section">
        <h2>➕ إضافة مشروع جديد</h2>

        <label>اسم المشروع</label>
        <input id="projectName" type="text" placeholder="مثال: برج كابو">

        <label>وصف المشروع</label>
        <textarea id="projectDescription"
        placeholder="اكتب وصفًا مختصرًا للمشروع"></textarea>

        <label>حالة المشروع</label>
        <select id="projectStatus">
            <option>فكرة جديدة</option>
            <option>قيد التصميم</option>
            <option>قيد التطوير</option>
            <option>مكتمل</option>
        </select>

        <label>تاريخ المشروع</label>
        <input id="projectDate" type="date">

        <button onclick="addProject()">
            💾 حفظ المشروع
        </button>
    </div>

    <div class="section">
        <h2>📁 المشاريع المسجلة</h2>

        <div id="projectsList">
            <div class="empty">
                لا توجد مشاريع حتى الآن.
            </div>
        </div>
    </div>

</div>

<footer>
    <button onclick="goHome()">🏠 الرئيسية</button>
    <button onclick="window.scrollTo({top:0,behavior:'smooth'})">
        👑 المالك
    </button>
    <button onclick="alert('الإعدادات قيد التجهيز')">
        ⚙️ الإعدادات
    </button>
</footer>

<script>

let projects = JSON.parse(localStorage.getItem("kapoProjects")) || [];

function saveProjects(){
    localStorage.setItem("kapoProjects", JSON.stringify(projects));
}

function addProject(){

    const name = document.getElementById("projectName").value.trim();
    const description = document.getElementById("projectDescription").value.trim();
    const status = document.getElementById("projectStatus").value;
    const date = document.getElementById("projectDate").value;

    if(!name){
        alert("فضلاً اكتب اسم المشروع");
        return;
    }

    const project = {
        id: Date.now(),
        name:name,
        description:description || "لا يوجد وصف للمشروع.",
        status:status,
        date:date || "غير محدد"
    };

    projects.push(project);

    saveProjects();

    document.getElementById("projectName").value="";
    document.getElementById("projectDescription").value="";
    document.getElementById("projectStatus").value="فكرة جديدة";
    document.getElementById("projectDate").value="";

    displayProjects();

    alert("تم حفظ المشروع بنجاح ✅");
}

function deleteProject(id){

    if(confirm("هل تريد حذف هذا المشروع؟")){

        projects = projects.filter(project => project.id !== id);

        saveProjects();

        displayProjects();
    }
}

function displayProjects(){

    const list = document.getElementById("projectsList");

    if(projects.length === 0){
        list.innerHTML = `
        <div class="empty">
            لا توجد مشاريع حتى الآن.
        </div>`;
        return;
    }

    list.innerHTML = "";

    projects.forEach(project => {

        list.innerHTML += `
        <div class="project">

            <div class="status">
                ${project.status}
            </div>

            <h3>🏢 ${project.name}</h3>

            <p>
                ${project.description}
            </p>

            <p>
                📅 تاريخ المشروع: ${project.date}
            </p>

            <button class="delete"
            onclick="deleteProject(${project.id})">
                🗑️ حذف المشروع
            </button>

        </div>
        `;
    });
}

function goHome(){

    window.location.href = "index.html";
}

displayProjects();

</script>

</body>
</html>
