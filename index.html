<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KAPO ONE | حساب المالك</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#070d19;
    color:white;
    min-height:100vh;
}

header{
    background:#0f172a;
    padding:20px;
    text-align:center;
    border-bottom:1px solid #1e293b;
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    color:#94a3b8;
    margin:8px 0 0;
}

.container{
    width:92%;
    max-width:1100px;
    margin:25px auto;
}

.card{
    background:#0f172a;
    border:1px solid #1e293b;
    border-radius:18px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h2,h3{
    margin-top:0;
}

input,
textarea{
    width:100%;
    padding:14px;
    margin:8px 0;
    border:1px solid #334155;
    border-radius:10px;
    background:#020617;
    color:white;
    font-size:16px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 18px;
    margin:5px;
    font-size:15px;
    cursor:pointer;
    background:#2563eb;
    color:white;
}

button:hover{
    opacity:.9;
}

.btn-danger{
    background:#dc2626;
}

.btn-secondary{
    background:#475569;
}

.btn-success{
    background:#16a34a;
}

.hidden{
    display:none !important;
}

.message{
    padding:12px;
    border-radius:10px;
    margin-top:10px;
    background:#172033;
}

.dashboard-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.stat{
    background:#111c2f;
    border:1px solid #263449;
    padding:20px;
    border-radius:16px;
    text-align:center;
}

.stat-number{
    font-size:30px;
    font-weight:bold;
    margin-top:10px;
}

.nav-buttons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin-bottom:20px;
}

.project-card{
    background:#111827;
    border:1px solid #263449;
    border-radius:18px;
    padding:18px;
    margin-bottom:18px;
}

.project-card img{
    width:100%;
    max-height:350px;
    object-fit:cover;
    border-radius:14px;
    margin-bottom:15px;
}

.project-title{
    font-size:22px;
    font-weight:bold;
    margin-bottom:8px;
}

.project-description{
    color:#cbd5e1;
    line-height:1.8;
    white-space:pre-wrap;
}

.project-date{
    color:#64748b;
    font-size:13px;
    margin-top:10px;
}

.like-box{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-top:15px;
    padding-top:15px;
    border-top:1px solid #263449;
}

.like-btn{
    background:#334155;
}

.like-btn.liked{
    background:#be123c;
}

.like-count{
    color:#cbd5e1;
}

.comments-section{
    margin-top:18px;
    padding-top:18px;
    border-top:1px solid #263449;
}

.comment-item{
    background:#0b1220;
    border:1px solid #263449;
    border-radius:12px;
    padding:14px;
    margin-top:10px;
}

.comment-user{
    font-weight:bold;
    color:#60a5fa;
}

.comment-date{
    color:#64748b;
    font-size:12px;
    margin-top:5px;
}

.comment-content{
    margin-top:10px;
    color:#e2e8f0;
    line-height:1.7;
    white-space:pre-wrap;
}

.comment-form{
    margin-top:15px;
}

.user-item{
    background:#111827;
    border:1px solid #263449;
    border-radius:12px;
    padding:14px;
    margin-bottom:10px;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:1000;
}

.modal-box{
    width:100%;
    max-width:600px;
    background:#0f172a;
    border:1px solid #334155;
    border-radius:18px;
    padding:22px;
}

footer{
    text-align:center;
    padding:25px;
    color:#64748b;
}

@media(max-width:800px){
    .dashboard-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:500px){
    .dashboard-grid{
        grid-template-columns:1fr 1fr;
    }

    button{
        width:auto;
    }
}
</style>

</head>

<body>

<header>
    <h1>🚀 KAPO ONE</h1>
    <p>لوحة تحكم المالك</p>
</header>


<!-- تسجيل الدخول -->

<div id="ownerLogin" class="container">

    <div class="card">

        <h2>🔐 دخول المالك</h2>

        <input
            id="loginEmail"
            type="email"
            placeholder="البريد الإلكتروني"
        >

        <input
            id="loginPassword"
            type="password"
            placeholder="كلمة المرور"
        >

        <button onclick="loginOwner()">دخول</button>

        <button
            class="btn-secondary"
            onclick="resetPassword()"
        >
            استعادة كلمة المرور
        </button>

        <div id="loginMessage"></div>

    </div>

</div>


<!-- لوحة التحكم -->

<div id="ownerDashboard" class="container hidden">

    <div class="card">

        <h2>👑 مرحباً بك في لوحة المالك</h2>

        <div class="nav-buttons">

            <button onclick="showDashboard()">
                🏠 الرئيسية
            </button>

            <button onclick="showUsers()">
                👥 المستخدمون
            </button>

            <button onclick="showProjects()">
                🏗️ المشاريع
            </button>

            <button onclick="showComments()">
                💬 التعليقات
            </button>

            <button onclick="showSecurity()">
                🔐 الأمان
            </button>

            <button
                class="btn-danger"
                onclick="logout()"
            >
                تسجيل الخروج
            </button>

        </div>

    </div>


    <div id="dashboardPage">

        <div class="dashboard-grid">

            <div class="stat">
                👥
                <div>المستخدمون</div>
                <div id="usersCount" class="stat-number">0</div>
            </div>

            <div class="stat">
                🏗️
                <div>المشاريع</div>
                <div id="projectsCount" class="stat-number">0</div>
            </div>

            <div class="stat">
                💬
                <div>التعليقات</div>
                <div id="commentsCount" class="stat-number">0</div>
            </div>

            <div class="stat">
                ❤️
                <div>الإعجابات</div>
                <div id="likesCount" class="stat-number">0</div>
            </div>

        </div>

    </div>


    <!-- المستخدمون -->

    <div id="usersPage" class="hidden">

        <div class="card">

            <h2>👥 إدارة المستخدمين</h2>

            <div id="usersList"></div>

        </div>

    </div>


    <!-- المشاريع -->

    <div id="projectsPage" class="hidden">

        <div class="card">

            <h2>🏗️ إدارة المشاريع</h2>

            <button
                class="btn-success"
                onclick="openAddProject()"
            >
                ➕ إضافة مشروع
            </button>

        </div>

        <div id="projectsList"></div>

    </div>


    <!-- التعليقات -->

    <div id="commentsPage" class="hidden">

        <div class="card">

            <h2>💬 إدارة التعليقات</h2>

            <div id="commentsList"></div>

        </div>

    </div>


    <!-- الأمان -->

    <div id="securityPage" class="hidden">

        <div class="card">

            <h2>🔐 الأمان</h2>

            <p>
                حساب المالك محمي بواسطة Supabase Authentication.
            </p>

            <button
                class="btn-danger"
                onclick="logout()"
            >
                تسجيل الخروج
            </button>

        </div>

    </div>

</div>


<!-- نافذة المشروع -->

<div
    id="projectModal"
    class="modal hidden"
>

    <div class="modal-box">

        <h2 id="modalTitle">
            إضافة مشروع
        </h2>

        <input
            id="projectTitle"
            placeholder="اسم المشروع"
        >

        <textarea
            id="projectDescription"
            placeholder="وصف المشروع"
        ></textarea>

        <input
            id="projectImage"
            placeholder="رابط صورة المشروع"
        >

        <button
            class="btn-success"
            onclick="saveProject()"
        >
            حفظ
        </button>

        <button
            class="btn-secondary"
            onclick="closeProjectModal()"
        >
            إلغاء
        </button>

        <div id="projectMessage"></div>

    </div>

</div>


<footer>
    KAPO ONE © 2026
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://ehmeircigoqfhftaotba.supabase.co";

const SUPABASE_KEY =
"sb_publishable_54N-aEBjhTQK1wUzpWl0fg_MQRq5D-T";

const OWNER_ID =
"dfe5695d-c77a-4ccb-a1eb-901d28169be2";

const SITE_URL =
"https://caapu11-debug.github.io/kapo-one/";

const db =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let editingProjectId = null;


/* =========================
   تسجيل الدخول
========================= */

async function loginOwner(){

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const message =
        document.getElementById("loginMessage");

    message.innerHTML = "جاري تسجيل الدخول...";

    const {data,error} =
        await db.auth.signInWithPassword({
            email,
            password
        });

    if(error){

        message.innerHTML =
        `<div class="message">❌ ${escapeHtml(error.message)}</div>`;

        return;
    }

    if(!data.user || data.user.id !== OWNER_ID){

        await db.auth.signOut();

        message.innerHTML =
        `<div class="message">
            ❌ هذا الحساب ليس حساب المالك.
        </div>`;

        return;
    }

    showOwnerDashboard();

}


async function resetPassword(){

    const email =
        document.getElementById("loginEmail").value.trim();

    const message =
        document.getElementById("loginMessage");

    if(!email){

        message.innerHTML =
        `<div class="message">
            اكتب البريد الإلكتروني أولاً.
        </div>`;

        return;
    }

    const {error} =
        await db.auth.resetPasswordForEmail(
            email,
            {
                redirectTo: SITE_URL
            }
        );

    if(error){

        message.innerHTML =
        `<div class="message">
            ❌ ${escapeHtml(error.message)}
        </div>`;

        return;
    }

    message.innerHTML =
    `<div class="message">
        ✅ تم إرسال رابط الاستعادة إلى بريدك الإلكتروني.
    </div>`;
}


/* =========================
   الجلسة
========================= */

async function checkSession(){

    const {data} =
        await db.auth.getSession();

    if(
        data.session &&
        data.session.user &&
        data.session.user.id === OWNER_ID
    ){

        showOwnerDashboard();

    }else{

        document
        .getElementById("ownerLogin")
        .classList.remove("hidden");

        document
        .getElementById("ownerDashboard")
        .classList.add("hidden");

    }

}


db.auth.onAuthStateChange(
    function(event,session){

        if(
            session &&
            session.user &&
            session.user.id === OWNER_ID
        ){

            showOwnerDashboard();

        }

    }
);


/* =========================
   فتح لوحة المالك
========================= */

function showOwnerDashboard(){

    document
    .getElementById("ownerLogin")
    .classList.add("hidden");

    document
    .getElementById("ownerDashboard")
    .classList.remove("hidden");

    showDashboard();

    loadUsers();
    loadProjects();
    loadComments();
    loadLikesTotal();

}


function hideAllPages(){

    document
    .getElementById("dashboardPage")
    .classList.add("hidden");

    document
    .getElementById("usersPage")
    .classList.add("hidden");

    document
    .getElementById("projectsPage")
    .classList.add("hidden");

    document
    .getElementById("commentsPage")
    .classList.add("hidden");

    document
    .getElementById("securityPage")
    .classList.add("hidden");

}


function showDashboard(){

    hideAllPages();

    document
    .getElementById("dashboardPage")
    .classList.remove("hidden");

}


function showUsers(){

    hideAllPages();

    document
    .getElementById("usersPage")
    .classList.remove("hidden");

    loadUsers();

}


function showProjects(){

    hideAllPages();

    document
    .getElementById("projectsPage")
    .classList.remove("hidden");

    loadProjects();

}


function showComments(){

    hideAllPages();

    document
    .getElementById("commentsPage")
    .classList.remove("hidden");

    loadComments();

}


function showSecurity(){

    hideAllPages();

    document
    .getElementById("securityPage")
    .classList.remove("hidden");

}


/* =========================
   تسجيل الخروج
========================= */

async function logout(){

    await db.auth.signOut();

    document
    .getElementById("ownerDashboard")
    .classList.add("hidden");

    document
    .getElementById("ownerLogin")
    .classList.remove("hidden");

}


/* =========================
   المستخدمون
========================= */

async function loadUsers(){

    const list =
        document.getElementById("usersList");

    list.innerHTML =
        "جاري تحميل المستخدمين...";

    const {data,error} =
        await db
        .from("profiles")
        .select("id,name,email,created_at")
        .order(
            "created_at",
            {ascending:false}
        );

    if(error){

        list.innerHTML =
        `<div class="message">
            ❌ ${escapeHtml(error.message)}
        </div>`;

        return;
    }

    document
    .getElementById("usersCount")
    .textContent =
        data.length;

    if(!data.length){

        list.innerHTML =
        `<div class="message">
            لا يوجد مستخدمون.
        </div>`;

        return;
    }

    list.innerHTML =
        data.map(user => `

        <div class="user-item">

            <strong>
                👤 ${escapeHtml(user.name || "بدون اسم")}
            </strong>

            <div>
                📧 ${escapeHtml(user.email || "")}
            </div>

            <div class="project-date">
                ${formatDate(user.created_at)}
            </div>

        </div>

    `).join("");

}


/* =========================
   المشاريع
========================= */

async function loadProjects(){

    const list =
        document.getElementById("projectsList");

    list.innerHTML =
        `<div class="card">جاري تحميل المشاريع...</div>`;

    const {data:projects,error} =
        await db
        .from("projects")
        .select("*")
        .order(
            "created_at",
            {ascending:false}
        );

    if(error){

        list.innerHTML =
        `<div class="card message">
            ❌ ${escapeHtml(error.message)}
        </div>`;

        return;
    }

    document
    .getElementById("projectsCount")
    .textContent =
        projects.length;


    const {data:likesData} =
        await db
        .from("likes")
        .select("id,project_id,user_id");


    const {data:sessionData} =
        await db.auth.getSession();

    const currentUser =
        sessionData.session?.user;


    if(!projects.length){

        list.innerHTML =
        `<div class="card">
            لا توجد مشاريع حتى الآن.
        </div>`;

        return;
    }


    list.innerHTML =
        projects.map(project => {

        const projectLikes =
            (likesData || [])
            .filter(
                like =>
                like.project_id === project.id
            );

        const likeCount =
            projectLikes.length;

        const isLiked =
            currentUser &&
            projectLikes.some(
                like =>
                like.user_id === currentUser.id
            );


        return `

        <div class="project-card">

            ${
                project.image_url
                ?
                `<img
                    src="${escapeHtml(project.image_url)}"
                    alt="${escapeHtml(project.title)}"
                >`
                :
                ""
            }


            <div class="project-title">
                ${escapeHtml(project.title)}
            </div>


            <div class="project-description">
                ${escapeHtml(project.description || "")}
            </div>


            <div class="project-date">
                ${formatDate(project.created_at)}
            </div>


            <div class="like-box">

                <button
                    class="like-btn ${isLiked ? "liked" : ""}"
                    onclick="toggleLike('${project.id}')"
                >
                    ${
                        isLiked
                        ?
                        "❤️ تم الإعجاب"
                        :
                        "🤍 إعجاب"
                    }
                </button>

                <div class="like-count">
                    ❤️ ${likeCount} إعجاب
                </div>

            </div>


            <div class="comments-section">

                <h3>
                    💬 التعليقات
                </h3>

                <div id="projectComments-${project.id}">
                    جاري تحميل التعليقات...
                </div>


                <div class="comment-form">

                    <textarea
                        id="commentInput-${project.id}"
                        placeholder="اكتب تعليقك هنا..."
                    ></textarea>

                    <button
                        class="btn-success"
                        onclick="addComment('${project.id}')"
                    >
                        💬 إضافة تعليق
                    </button>

                </div>

            </div>


            <div style="margin-top:15px">

                <button
                    onclick="openEditProject('${project.id}')"
                >
                    ✏️ تعديل
                </button>

                <button
                    class="btn-danger"
                    onclick="deleteProject('${project.id}')"
                >
                    🗑️ حذف
                </button>

            </div>

        </div>

        `;

    }).join("");


    for(const project of projects){

        loadProjectComments(project.id);

    }

}


/* =========================
   إضافة مشروع
========================= */

function openAddProject(){

    editingProjectId = null;

    document
    .getElementById("modalTitle")
    .textContent =
        "إضافة مشروع";

    document
    .getElementById("projectTitle")
    .value = "";

    document
    .getElementById("projectDescription")
    .value = "";

    document
    .getElementById("projectImage")
    .value = "";

    document
    .getElementById("projectMessage")
    .innerHTML = "";

    document
    .getElementById("projectModal")
    .classList.remove("hidden");

}


function closeProjectModal(){

    document
    .getElementById("projectModal")
    .classList.add("hidden");

}


async function saveProject(){

    const title =
        document
        .getElementById("projectTitle")
        .value
        .trim();

    const description =
        document
        .getElementById("projectDescription")
        .value
        .trim();

    const image_url =
        document
        .getElementById("projectImage")
        .value
        .trim();

    const message =
        document
        .getElementById("projectMessage");


    if(!title){

        message.innerHTML =
        `<div class="message">
            اكتب اسم المشروع.
        </div>`;

        return;
    }


    const {data:sessionData} =
        await db.auth.getSession();

    const user =
        sessionData.session?.user;


    if(!user){

        message.innerHTML =
        `<div class="message">
            ❌ يجب تسجيل الدخول.
        </div>`;

        return;
    }


    let result;


    if(editingProjectId){

        result =
            await db
            .from("projects")
            .update({
                title,
                description,
                image_url
            })
            .eq(
                "id",
                editingProjectId
            )
            .eq(
                "user_id",
                user.id
            );

    }else{

        result =
            await db
            .from("projects")
            .insert({
                user_id:user.id,
                title,
                description,
                image_url
            });

    }


    if(result.error){

        message.innerHTML =
        `<div class="message">
            ❌ ${escapeHtml(result.error.message)}
        </div>`;

        return;
    }


    message.innerHTML =
    `<div class="message">
        ✅ تم الحفظ بنجاح.
    </div>`;


    await loadProjects();

    setTimeout(
        closeProjectModal,
        500
    );

}


/* =========================
   تعديل مشروع
========================= */

async function openEditProject(id){

    const {data,error} =
        await db
        .from("projects")
        .select("*")
        .eq("id",id)
        .single();


    if(error){

        alert(error.message);

        return;
    }


    editingProjectId = id;


    document
    .getElementById("modalTitle")
    .textContent =
        "تعديل المشروع";


    document
    .getElementById("projectTitle")
    .value =
        data.title || "";


    document
    .getElementById("projectDescription")
    .value =
        data.description || "";


    document
    .getElementById("projectImage")
    .value =
        data.image_url || "";


    document
    .getElementById("projectMessage")
    .innerHTML = "";


    document
    .getElementById("projectModal")
    .classList.remove("hidden");

}


/* =========================
   حذف مشروع
========================= */

async function deleteProject(id){

    if(
        !confirm(
            "هل أنت متأكد من حذف هذا المشروع؟"
        )
    ){

        return;
    }


    const {data:sessionData} =
        await db.auth.getSession();

    const user =
        sessionData.session?.user;


    if(!user){

        alert("يجب تسجيل الدخول.");

        return;
    }


    const {error} =
        await db
        .from("projects")
        .delete()
        .eq("id",id)
        .eq("user_id",user.id);


    if(error){

        alert(
            "خطأ: " +
            error.message
        );

        return;
    }


    await loadProjects();

    await loadLikesTotal();

    await loadComments();

}


/* =========================
   الإعجابات
========================= */

async function toggleLike(projectId){

    const {data:sessionData} =
        await db.auth.getSession();

    const user =
        sessionData.session?.user;


    if(!user){

        alert(
            "يجب تسجيل الدخول أولاً."
        );

        return;
    }


    const {data:existing,error:checkError} =
        await db
        .from("likes")
        .select("id")
        .eq(
            "project_id",
            projectId
        )
        .eq(
            "user_id",
            user.id
        )
        .maybeSingle();


    if(checkError){

        alert(
            "خطأ: " +
            checkError.message
        );

        return;
    }


    if(existing){

        const {error} =
            await db
            .from("likes")
            .delete()
            .eq(
                "id",
                existing.id
            );


        if(error){

            alert(
                "خطأ: " +
                error.message
            );

            return;
        }

    }else{

        const {error} =
            await db
            .from("likes")
            .insert({
                project_id:projectId,
                user_id:user.id
            });


        if(error){

            alert(
                "خطأ: " +
                error.message
            );

            return;
        }

    }


    await loadProjects();

    await loadLikesTotal();

}


/* =========================
   مجموع الإعجابات
========================= */

async function loadLikesTotal(){

    const {count,error} =
        await db
        .from("likes")
        .select(
            "*",
            {
                count:"exact",
                head:true
            }
        );


    if(!error){

        document
        .getElementById("likesCount")
        .textContent =
            count || 0;

    }

}


/* =========================
   التعليقات داخل المشاريع
========================= */

async function loadProjectComments(projectId){

    const box =
        document
        .getElementById(
            `projectComments-${projectId}`
        );


    if(!box) return;


    const {data,error} =
        await db
        .from("comments")
        .select(`
            id,
            content,
            created_at,
            user_id,
            profiles(name,email)
        `)
        .eq(
            "project_id",
            projectId
        )
        .order(
            "created_at",
            {ascending:true}
        );


    if(error){

        box.innerHTML =
        `<div class="message">
            ❌ ${escapeHtml(error.message)}
        </div>`;

        return;
    }


    if(!data || !data.length){

        box.innerHTML =
        `<div style="color:#64748b">
            لا توجد تعليقات حتى الآن.
        </div>`;

        return;
    }


    const {data:sessionData} =
        await db.auth.getSession();

    const currentUser =
        sessionData.session?.user;


    box.innerHTML =
        data.map(comment => {

        const isOwner =
            currentUser &&
            currentUser.id === OWNER_ID;

        const isCommentOwner =
            currentUser &&
            currentUser.id === comment.user_id;


        return `

        <div class="comment-item">

            <div class="comment-user">
                👤 ${
                    escapeHtml(
                        comment.profiles?.name ||
                        comment.profiles?.email ||
                        "مستخدم"
                    )
                }
            </div>

            <div class="comment-content">
                ${escapeHtml(comment.content)}
            </div>

            <div class="comment-date">
                ${formatDate(comment.created_at)}
            </div>

            ${
                isOwner || isCommentOwner
                ?
                `<button
                    class="btn-danger"
                    onclick="deleteComment('${comment.id}')"
                >
                    🗑️ حذف التعليق
                </button>`
                :
                ""
            }

        </div>

        `;

    }).join("");

}


/* =========================
   إضافة تعليق
========================= */

async function addComment(projectId){

    const input =
        document
        .getElementById(
            `commentInput-${projectId}`
        );


    if(!input){

        return;
    }


    const content =
        input.value.trim();


    if(!content){

        alert(
            "اكتب التعليق أولاً."
        );

        return;
    }


    const {data:sessionData} =
        await db.auth.getSession();

    const user =
        sessionData.session?.user;


    if(!user){

        alert(
            "يجب تسجيل الدخول أولاً."
        );

        return;
    }


    const {error} =
        await db
        .from("comments")
        .insert({
            project_id:projectId,
            user_id:user.id,
            content:content
        });


    if(error){

        alert(
            "خطأ في إضافة التعليق: " +
            error.message
        );

        return;
    }


    input.value = "";


    await loadProjectComments(projectId);

    await loadComments();

}


/* =========================
   إدارة التعليقات
========================= */

async function loadComments(){

    const list =
        document.getElementById(
            "commentsList"
        );


    if(!list) return;


    list.innerHTML =
        "جاري تحميل التعليقات...";


    const {data,error} =
        await db
        .from("comments")
        .select(`
            id,
            content,
            created_at,
            project_id,
            user_id,
            profiles(name,email),
            projects(title)
        `)
        .order(
            "created_at",
            {ascending:false}
        );


    if(error){

        list.innerHTML =
        `<div class="message">
            ❌ ${escapeHtml(error.message)}
        </div>`;

        return;
    }


    document
    .getElementById("commentsCount")
    .textContent =
        data.length;


    if(!data.length){

        list.innerHTML =
        `<div class="message">
            لا توجد تعليقات حتى الآن.
        </div>`;

        return;
    }


    list.innerHTML =
        data.map(comment => `

        <div class="comment-item">

            <div class="comment-user">
                👤 ${
                    escapeHtml(
                        comment.profiles?.name ||
                        comment.profiles?.email ||
                        "مستخدم"
                    )
                }
            </div>

            <div>
                🏗️ ${
                    escapeHtml(
                        comment.projects?.title ||
                        "مشروع"
                    )
                }
            </div>

            <div class="comment-content">
                ${escapeHtml(comment.content)}
            </div>

            <div class="comment-date">
                ${formatDate(comment.created_at)}
            </div>

            <button
                class="btn-danger"
                onclick="deleteComment('${comment.id}')"
            >
                🗑️ حذف
            </button>

        </div>

    `).join("");

}


/* =========================
   حذف تعليق
========================= */

async function deleteComment(id){

    if(
        !confirm(
            "هل تريد حذف هذا التعليق؟"
        )
    ){

        return;
    }


    const {data:sessionData} =
        await db.auth.getSession();

    const user =
        sessionData.session?.user;


    if(!user){

        alert(
            "يجب تسجيل الدخول."
        );

        return;
    }


    const {error} =
        await db
        .from("comments")
        .delete()
        .eq(
            "id",
            id
        );


    if(error){

        alert(
            "خطأ: " +
            error.message
        );

        return;
    }


    await loadComments();

    await loadProjects();

}


/* =========================
   أدوات
========================= */

function formatDate(date){

    if(!date) return "";

    try{

        return new Date(date)
        .toLocaleString(
            "ar-SA"
        );

    }catch(e){

        return date;

    }

}


function escapeHtml(value){

    if(value === null || value === undefined){

        return "";

    }

    return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

   بدء التشغيل
========================= */

checkSession();
