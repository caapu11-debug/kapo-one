<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KAPO ONE | معرض الأعمال</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
}

header{
    background:#111827;
    padding:20px;
    text-align:center;
    border-bottom:1px solid #334155;
}

.logo{
    font-size:30px;
    font-weight:bold;
}

.subtitle{
    color:#94a3b8;
    margin-top:8px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.hero{
    text-align:center;
    padding:30px 10px;
}

.hero h1{
    font-size:32px;
}

.hero p{
    color:#cbd5e1;
}

.add-box{
    background:#1e293b;
    border:2px dashed #475569;
    border-radius:18px;
    padding:30px 20px;
    text-align:center;
    margin:20px 0 30px;
}

.add-box h2{
    margin-top:0;
}

.add-button{
    display:inline-block;
    background:#2563eb;
    color:white;
    padding:14px 25px;
    border-radius:12px;
    cursor:pointer;
    font-size:18px;
    font-weight:bold;
}

.add-button:hover{
    background:#1d4ed8;
}

#imageInput{
    display:none;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:20px;
}

.image-card{
    background:#1e293b;
    border-radius:18px;
    overflow:hidden;
    border:1px solid #334155;
}

.image-card img{
    width:100%;
    height:220px;
    object-fit:cover;
    display:block;
}

.image-info{
    padding:15px;
}

.image-info h3{
    margin:0 0 8px;
}

.image-info p{
    color:#94a3b8;
    margin:0;
}

.empty{
    text-align:center;
    color:#94a3b8;
    padding:40px;
    background:#111827;
    border-radius:18px;
}

.back{
    display:inline-block;
    margin-top:30px;
    background:#334155;
    color:white;
    padding:12px 22px;
    border-radius:10px;
    text-decoration:none;
}

footer{
    margin-top:40px;
    background:#111827;
    padding:20px;
    text-align:center;
    color:#94a3b8;
}
</style>
</head>

<body>

<header>
    <div class="logo">🚀 KAPO ONE</div>
    <div class="subtitle">منصة الأعمال والأفكار العالمية</div>
</header>

<div class="container">

    <section class="hero">
        <h1>🖼️ معرض الأعمال</h1>
        <p>
            اعرض مشاريعك وتصاميمك وأعمالك في منصة KAPO ONE
        </p>
    </section>

    <section class="add-box">

        <h2>➕ إضافة عمل جديد</h2>

        <p>
            اختر صورة من جهازك لإضافتها إلى المعرض
        </p>

        <label for="imageInput" class="add-button">
            📷 إضافة صورة
        </label>

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            onchange="addImage(event)"
        >

    </section>

    <section id="gallery" class="gallery">

        <div class="empty" id="emptyMessage">
            لا توجد أعمال مضافة حتى الآن
            <br><br>
            اضغط «إضافة صورة» لبدء المعرض 🚀
        </div>

    </section>

    <a href="index.html" class="back">
        🏠 العودة إلى الرئيسية
    </a>

</div>

<footer>
    © 2026 KAPO ONE — جميع الحقوق محفوظة
</footer>

<script>

function addImage(event){

    const file = event.target.files[0];

    if(!file){
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e){

        const gallery = document.getElementById("gallery");
        const emptyMessage = document.getElementById("emptyMessage");

        if(emptyMessage){
            emptyMessage.remove();
        }

        const card = document.createElement("div");

        card.className = "image-card";

        card.innerHTML = `
            <img src="${e.target.result}" alt="عمل جديد">

            <div class="image-info">
                <h3>عمل جديد</h3>
                <p>تمت إضافة الصورة إلى معرض KAPO ONE</p>
            </div>
        `;

        gallery.appendChild(card);

    };

    reader.readAsDataURL(file);

}

</script>

</body>
</html>
