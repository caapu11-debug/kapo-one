<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>KAPO ONE | المعرض</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1120;
color:white;
}

header{
background:#111827;
padding:20px;
text-align:center;
border-bottom:1px solid #263449;
}

.logo{
font-size:30px;
font-weight:bold;
}

.logo span{
color:#38bdf8;
}

.container{
max-width:1100px;
margin:auto;
padding:40px 20px;
}

.hero{
text-align:center;
margin-bottom:35px;
}

.hero-icon{
font-size:65px;
}

h1{
font-size:36px;
margin:10px 0;
}

.hero p{
color:#94a3b8;
}

.add-box{
background:#111827;
border:1px solid #263449;
border-radius:18px;
padding:25px;
text-align:center;
margin-bottom:30px;
}

.add-button{
display:inline-block;
background:#2563eb;
color:white;
padding:14px 25px;
border-radius:10px;
cursor:pointer;
font-size:17px;
}

.add-button:hover{
background:#1d4ed8;
}

#imageInput{
display:none;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#111827;
border:1px solid #263449;
border-radius:18px;
overflow:hidden;
}

.card img{
width:100%;
height:220px;
object-fit:cover;
display:block;
}

.card-body{
padding:20px;
text-align:center;
}

.card-body h2{
margin:0 0 8px;
}

.card-body p{
color:#94a3b8;
}

.empty{
background:#111827;
border:1px solid #263449;
border-radius:18px;
padding:40px;
text-align:center;
color:#94a3b8;
}

.back{
text-align:center;
margin-top:35px;
}

.back a{
display:inline-block;
background:#334155;
color:white;
text-decoration:none;
padding:12px 25px;
border-radius:10px;
}

footer{
margin-top:40px;
background:#080d18;
padding:25px;
text-align:center;
color:#94a3b8;
}

</style>

</head>

<body>


<header>

<div class="logo">

🚀 KAPO <span>ONE</span>

</div>

</header>


<div class="container">


<section class="hero">

<div class="hero-icon">
🖼️
</div>

<h1>
معرض KAPO ONE
</h1>

<p>
مساحة لعرض التصاميم والمشاريع والأعمال.
</p>

</section>


<section class="add-box">

<h2>
➕ إضافة صورة
</h2>

<p>
اختر صورة من هاتفك لإضافتها إلى المعرض.
</p>

<label
for="imageInput"
class="add-button">

📷 اختيار صورة

</label>

<input
type="file"
id="imageInput"
accept="image/*">

</section>


<section
class="gallery"
id="gallery">

<div
class="empty"
id="empty">

لا توجد صور في المعرض حاليًا.

<br>

اضغط «اختيار صورة» لإضافة أول عمل 🚀

</div>

</section>


<div class="back">

<a href="index.html">

🏠 العودة إلى الرئيسية

</a>

</div>


</div>


<footer>

🚀 KAPO ONE

<br><br>

منصة الأعمال والأفكار والتصاميم

<br><br>

© 2026 KAPO ONE

</footer>


<script>

const imageInput =
document.getElementById("imageInput");

const gallery =
document.getElementById("gallery");

const empty =
document.getElementById("empty");


imageInput.addEventListener(
"change",
function(){

const file =
this.files[0];

if(!file){
return;
}


const reader =
new FileReader();


reader.onload =
function(event){

if(empty){
empty.remove();
}


const card =
document.createElement("div");

card.className="card";


card.innerHTML=`

<img
src="${event.target.result}"
alt="عمل KAPO ONE">

<div class="card-body">

<h2>
عمل جديد
</h2>

<p>
صورة مضافة إلى معرض KAPO ONE
</p>

</div>

`;


gallery.appendChild(card);

};


reader.readAsDataURL(file);

});

</script>


</body>

</html>
