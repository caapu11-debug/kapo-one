<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAPO ONE</title><style>
body{
    margin:0;
    padding:30px 20px;
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

.box{
    max-width:700px;
    margin:auto;
    padding:30px;
    background:#1e293b;
    border-radius:20px;
}

textarea{
    width:100%;
    min-height:120px;
    padding:15px;
    margin-top:20px;
    border:0;
    border-radius:12px;
    font-size:18px;
    box-sizing:border-box;
}

button{
    display:block;
    width:100%;
    padding:18px;
    margin-top:20px;
    border:0;
    border-radius:12px;
    background:#7c3aed;
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

#result{
    display:none;
    margin-top:20px;
    padding:20px;
    background:#0f172a;
    border-radius:15px;
}
</style></head><body><div class="box"><h1>🚀 KAPO ONE | كابو ون</h1><h2>💡 مولّد فكرة المشروع</h2><p>اكتب فكرتك هنا ثم اضغط الزر ليقوم كابو بتحليلها.</p><textarea id="idea" placeholder="مثال: برج على شكل ذرة"></textarea><button type="button" onclick="analyzeIdea()">
🚀 حلّل الفكرة
</button><div id="result"></div></div><script>
function analyzeIdea(){

    const idea = document.getElementById("idea").value.trim();

    if(idea === ""){
        alert("⚠️ اكتب فكرتك أولًا.");
        return;
    }

    document.getElementById("result").style.display = "block";

    document.getElementById("result").innerHTML =
    "🏗️ <strong>تحليل فكرة المشروع</strong><br><br>" +
    "الفكرة التي أدخلتها:<br>" +
    idea +
    "<br><br>" +
    "✅ كابو جاهز لتطوير هذه الفكرة.";

}
</script></body>
</html>
