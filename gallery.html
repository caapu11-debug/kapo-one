<script>

let works =
JSON.parse(localStorage.getItem("KAPO_ONE_WORKS")) || [];


/* إخفاء جميع الصفحات */

function hidePages(){

document.getElementById("galleryPage").classList.remove("show");

document.getElementById("workPage").classList.remove("show");

document.getElementById("photoPage").classList.remove("show");

}


/* فتح معرض الأعمال */

function openGallery(){

hidePages();

document.getElementById("galleryPage").classList.add("show");

displayWorks();

}


/* فتح إضافة عمل */

function openWork(){

hidePages();

document.getElementById("workPage").classList.add("show");

}


/* فتح إضافة صورة */

function choosePhoto(){

hidePages();

document.getElementById("photoPage").classList.add("show");

document.getElementById("photoInput").click();

}


/* اختيار صورة فقط */

document.getElementById("photoInput").addEventListener(
"change",
function(){

let file = this.files[0];

if(!file){
return;
}

let reader = new FileReader();

reader.onload = function(e){

let work = {

name:"صورة جديدة",

type:"",

description:"صورة مضافة إلى معرض KAPO ONE",

image:e.target.result

};

works.push(work);

saveWorks();

displayWorks();

openGallery();

};

reader.readAsDataURL(file);

this.value="";

});


/* إضافة عمل كامل */

function saveWork(){

let name =
document.getElementById("name").value.trim();

let type =
document.getElementById("type").value;

let description =
document.getElementById("description").value.trim();

let image =
document.getElementById("workImage").files[0];


if(name===""){

alert("يرجى كتابة اسم العمل.");

return;

}

if(type===""){

alert("يرجى اختيار نوع العمل.");

return;

}

if(description===""){

alert("يرجى كتابة وصف العمل.");

return;

}

if(!image){

alert("يرجى اختيار صورة العمل.");

return;

}


let reader = new FileReader();


reader.onload = function(e){

let work = {

name:name,

type:type,

description:description,

image:e.target.result

};


works.push(work);

saveWorks();

displayWorks();


document.getElementById("name").value="";

document.getElementById("type").value="";

document.getElementById("description").value="";

document.getElementById("workImage").value="";


openGallery();

alert("✅ تم حفظ العمل بنجاح.");

};


reader.readAsDataURL(image);

}


/* حفظ البيانات */

function saveWorks(){

localStorage.setItem(
"KAPO_ONE_WORKS",
JSON.stringify(works)
);

}


/* عرض الأعمال */

function displayWorks(){

let gallery =
document.getElementById("gallery");

gallery.innerHTML="";


if(works.length===0){

gallery.innerHTML=`

<div class="empty" id="empty">

لا توجد أعمال مضافة حتى الآن.

<br><br>

يمكنك إضافة عمل جديد أو صورة.

</div>

`;

return;

}


works.forEach(function(work,index){

let card =
document.createElement("div");

card.className="card";


let image =
document.createElement("img");

image.src=work.image;

image.alt=work.name;


let body =
document.createElement("div");

body.className="card-body";


let title =
document.createElement("h3");

title.textContent=work.name;


let description =
document.createElement("p");

description.textContent=work.description;


body.appendChild(title);

body.appendChild(description);


if(work.type){

let type =
document.createElement("p");

type.textContent=work.type;

type.className="type";

body.appendChild(type);

}


let deleteButton =
document.createElement("button");

deleteButton.textContent="🗑️ حذف";

deleteButton.style.marginTop="15px";

deleteButton.style.padding="10px 20px";

deleteButton.style.border="0";

deleteButton.style.borderRadius="8px";

deleteButton.style.background="#dc2626";

deleteButton.style.color="white";

deleteButton.style.cursor="pointer";


deleteButton.onclick=function(){

if(confirm("هل تريد حذف هذا العمل؟")){

works.splice(index,1);

saveWorks();

displayWorks();

}

};


body.appendChild(deleteButton);

card.appendChild(image);

card.appendChild(body);

gallery.appendChild(card);

});

}


/* تحميل الأعمال عند فتح الصفحة */

document.addEventListener(
"DOMContentLoaded",
function(){

displayWorks();

}
);

</script>
