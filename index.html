<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAPO ONE | كابو ون 🚀:</title><style>

body{
margin:0;
background:#0f172a;
color:white;
font-family:Arial,sans-serif;
}

.container{
max-width:800px;
margin:auto;
padding:20px;
}

header{
background:#1e293b;
padding:25px;
border-radius:18px;
text-align:center;
font-size:30px;
font-weight:bold;
}

.box{
margin-top:20px;
background:#1e293b;
padding:25px;
border-radius:18px;
border:2px solid #7c3aed;
}

h2{
text-align:center;
color:#c4b5fd;
}

p{
text-align:center;
color:#cbd5e1;
line-height:1.8;
}

textarea{
width:100%;
height:130px;
padding:15px;
margin-top:15px;
border-radius:12px;
border:0;
font-size:18px;
box-sizing:border-box;
}

button{
width:100%;
padding:18px;
margin-top:15px;
border:0;
border-radius:12px;
background:#7c3aed;
color:white;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}

#result{
display:none;
margin-top:20px;
padding:20px;
background:#111827;
border-radius:15px;
line-height:2;
}

.section{
background:#1e293b;
padding:15px;
margin-top:12px;
border-radius:10px;
}

.visual{
display:none;
margin-top:20px;
padding:20px;
background:#020617;
border-radius:18px;
text-align:center;
}

.tower{
position:relative;
width:180px;
height:360px;
margin:30px auto;
}

.core{
position:absolute;
left:50%;
top:40px;
transform:translateX(-50%);
width:75px;
height:280px;
border-radius:40px;
background:linear-gradient(to right,#64748b,#e2e8f0,#64748b);
box-shadow:0 0 30px #7c3aed;
}

.floor{
position:absolute;
left:50%;
transform:translateX(-50%);
width:125px;
height:7px;
background:#c4b5fd;
border-radius:10px;
}

.f1{top:75px}
.f2{top:110px}
.f3{top:145px}
.f4{top:180px}
.f5{top:215px}
.f6{top:250px}
.f7{top:285px}

.orbit{
position:absolute;
left:50%;
top:130px;
width:190px;
height:90px;
border:3px solid #a78bfa;
border-radius:50%;
transform:translateX(-50%) rotate(-20deg);
}

.atom{
position:absolute;
width:22px;
height:22px;
background:#c4b5fd;
border-radius:50%;
box-shadow:0 0 20px #7c3aed;
}

.atom1{
top:95px;
left:5px;
}

.atom2{
top:180px;
right:0;
}

.atom3{
top:250px;
left:10px;
}

.base{
position:absolute;
bottom:0;
left:20px;
width:140px;
height:20px;
background:#475569;
border-radius:50%;
}

footer{
margin-top:30px;
padding:20px;
text-align:center;
color:#94a3b8;
}

</style></head><body><div class="container"><header>
🚀 KAPO ONE | كابو ون
</header><div class="box"><h2>
💡 مولّد فكرة المشروع
</h2><p>
اكتب فكرتك هنا ليقوم كابو بتحويلها إلى تصور مشروع.
</p><textarea
id="idea"
placeholder="مثال: برج على شكل ذرة"
></textarea><button
id="analyzeButton"
type="button">
🚀 حلّل الفكرة
</button>

<div id="result"></div><div id="visual" class="visual"><h2>
🖼️ التصور البصري
</h2><p>
تصور أولي لبرج KAPO ATOM
</p><div class="tower"><div class="orbit"></div><div class="core"></div><div class="floor f1"></div>
<div class="floor f2"></div>
<div class="floor f3"></div>
<div class="floor f4"></div>
<div class="floor f5"></div>
<div class="floor f6"></div>
<div class="floor f7"></div><div class="atom atom1"></div>
<div class="atom atom2"></div>
<div class="atom atom3"></div><div class="base"></div></div><div class="section">
<strong>🏗️ KAPO ATOM</strong><br>
برج مستقبلي مستوحى من تركيب الذرة.
</div></div></div></div><footer>
© 2026 KAPO ONE
</footer><script>

document.getElementById("analyzeButton").addEventListener("click",function(){

var idea=document.getElementById("idea").value.trim();

var result=document.getElementById("result");

var visual=document.getElementById("visual");

if(idea===""){

result.innerHTML="⚠️ اكتب فكرتك أولًا.";

result.style.display="block";

visual.style.display="none";

return;

}

if(
idea.includes("ذرة") ||
idea.includes("ذره") ||
idea.toLowerCase().includes("atom")
){

result.innerHTML=

"<h2>🏗️ تحليل فكرة برج الذرة</h2>"+

"<div class='section'>"+
"<strong>🏷️ اسم المشروع</strong><br>"+
"KAPO ATOM | برج كابو الذري"+
"</div>"+

"<div class='section'>"+
"<strong>💡 الفكرة المعمارية</strong><br>"+
"برج مستقبلي مستوحى من شكل الذرة، "+
"حيث تمثل النواة مركز البرج وتحيط بها "+
"كتل معمارية مستوحاة من الإلكترونات."
+
"</div>"+

"<div class='section'>"+
"<strong>🏢 الاستخدامات</strong><br>"+
"فندق، مكاتب، شقق فندقية، مطاعم، "+
"منصة مشاهدة ومساحات للفعاليات."
+
"</div>"+

"<div class='section'>"+
"<strong>🌟 المميزات</strong><br>"+
"شكل معماري مميز، واجهات ديناميكية، "+
"إضاءة ليلية ومساحات متعددة الاستخدام."
+
"</div>";

visual.style.display="block";

}else{

result.innerHTML=

"<h2>🏗️ تحليل فكرة المشروع</h2>"+

"<div class='section'>"+
"<strong>📌 فكرتك:</strong><br>"+
idea+
"</div>"+

"<div class='section'>"+
"✅ تم استلام الفكرة بنجاح ويمكن تطويرها إلى تصور معماري."
+
"</div>";

visual.style.display="none";

}

result.style.display="block";

result.scrollIntoView({
behavior:"smooth",
block:"start"
});

});

</script></body>
</html>
