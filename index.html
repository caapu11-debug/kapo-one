<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAPO ONE | كابو ون 🚀</title><style>
*{box-sizing:border-box}

body{
margin:0;
padding:20px;
background:#0f172a;
color:white;
font-family:Arial,sans-serif;
}

.container{
max-width:800px;
margin:auto;
}

header{
background:#1e293b;
padding:25px;
border-radius:18px;
text-align:center;
font-size:30px;
font-weight:bold;
}

.card{
margin-top:20px;
padding:25px;
background:#1e293b;
border-radius:18px;
border:2px solid #7c3aed;
}

h2{
text-align:center;
color:#c4b5fd;
}

p{
color:#cbd5e1;
text-align:center;
line-height:1.8;
}

textarea{
width:100%;
height:130px;
padding:15px;
margin-top:15px;
border:0;
border-radius:12px;
font-size:18px;
font-family:Arial;
}

button{
display:block;
width:100%;
padding:18px;
margin-top:15px;
border:0;
border-radius:12px;
background:#7c3aed;
color:white;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

#result{
display:none;
margin-top:20px;
padding:20px;
background:#0f172a;
border-radius:15px;
border:1px solid #475569;
line-height:2;
}

#result h3{
color:#c4b5fd;
}

.item{
background:#1e293b;
padding:15px;
margin-top:12px;
border-radius:10px;
}

.green{
color:#86efac;
font-weight:bold;
}
</style></head><body><div class="container"><header>
🚀 KAPO ONE | كابو ون
</header><div class="card"><h2>💡 مولّد فكرة المشروع</h2><p>
اكتب فكرتك هنا، وسيقوم كابو بتحليلها وتحويلها إلى تصور أولي.
</p><textarea
id="idea"
placeholder="مثال: برج على شكل ذرة"
></textarea><button
type="button"
onclick="analyzeIdea()">
🚀 حلّل الفكرة
</button>

<div id="result"></div></div></div><script>

function analyzeIdea(){

var idea =
document.getElementById("idea").value.trim();

var result =
document.getElementById("result");

if(idea === ""){

result.innerHTML =
"⚠️ اكتب فكرة المشروع أولًا.";

result.style.display="block";

return;
}

var lower =
idea.toLowerCase();

if(
lower.includes("ذرة") ||
lower.includes("ذره") ||
lower.includes("atom")
){

result.innerHTML =

"<h3>🏗️ تحليل فكرة المشروع</h3>" +

"<div class='green'>✅ تم التعرف على الفكرة: برج على شكل ذرة</div>" +

"<div class='item'>" +
"<strong>🏷️ اسم المشروع</strong><br>" +
"KAPO ATOM | برج كابو الذري" +
"</div>" +

"<div class='item'>" +
"<strong>💡 الفكرة المعمارية</strong><br>" +
"تصميم برج مستقبلي مستوحى من تركيب الذرة. " +
"تمثل النواة مركز البرج، بينما يتم توزيع الكتل والمساحات حولها بصورة مستوحاة من حركة الإلكترونات." +
"</div>" +

"<div class='item'>" +
"<strong>🏢 الاستخدامات المقترحة</strong><br>" +
"مكاتب، فندق، شقق فندقية، مطاعم، منصة مشاهدة، ومساحات للفعاليات." +
"</div>" +

"<div class='item'>" +
"<strong>🌟 العناصر المميزة</strong><br>" +
"نواة مركزية، واجهات ديناميكية، إضاءة معمارية ليلية، منصة مشاهدة، ومساحات متعددة الاستخدام." +
"</div>" +

"<div class='item'>" +
"<strong>📐 الخطوة الهندسية التالية</strong><br>" +
"تحديد ارتفاع البرج، عدد الأدوار، مساحة الدور، نوع الاستخدام، ونظام الهيكل الإنشائي." +
"</div>" +

"<div class='item'>" +
"<strong>⚠️ ملاحظة</strong><br>" +
"هذا تحليل وتصوّر أولي للفكرة وليس مخططًا هندسيًا معتمدًا." +
"</div>";

}else{

result.innerHTML =

"<h3>🏗️ تحليل فكرة المشروع</h3>" +

"<div class='green'>✅ تم تحليل الفكرة</div>" +

"<div class='item'>" +
"<strong>📌 فكرتك:</strong><br>" +
idea +
"</div>" +

"<div class='item'>" +
"<strong>💡 التصور الأولي:</strong><br>" +
"يمكن تطوير هذه الفكرة إلى مشروع معماري متكامل من خلال تحديد الشكل، الاستخدام، الارتفاع، المساحات والمكونات الهندسية." +
"</div>";

}

result.style.display="block";

result.scrollIntoView({
behavior:"smooth",
block:"start"
});

}

</script></body>
</html>
