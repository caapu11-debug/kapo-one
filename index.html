<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAPO ONE | كابو ون 🚀</title><style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
}

header{
background:#1e293b;
padding:25px;
text-align:center;
font-size:30px;
font-weight:bold;
}

.container{
max-width:800px;
margin:auto;
padding:20px;
}

.card{
background:#1e293b;
padding:25px;
margin-top:20px;
border-radius:18px;
border:2px solid #7c3aed;
}

h2{
text-align:center;
color:#c4b5fd;
}

.description{
text-align:center;
color:#cbd5e1;
font-size:17px;
line-height:1.8;
}

textarea{
width:100%;
height:130px;
padding:15px;
margin-top:15px;
border:0;
border-radius:12px;
font-size:18px;
font-family:Arial,sans-serif;
resize:vertical;
}

button{
display:block;
width:100%;
padding:17px;
margin-top:15px;
border:0;
border-radius:12px;
background:#7c3aed;
color:white;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

button:active{
transform:scale(.98);
}

.result{
display:none;
margin-top:20px;
padding:20px;
background:#0f172a;
border-radius:15px;
border:1px solid #475569;
line-height:2;
}

.result h3{
color:#c4b5fd;
}

.success{
color:#86efac;
font-weight:bold;
}
</style></head><body><header>
🚀 KAPO ONE | كابو ون
</header><div class="container"><div class="card"><h2>
💡 مولّد فكرة المشروع
</h2><div class="description">
اكتب فكرتك هنا ثم اضغط الزر ليقوم كابو بتحليلها.
</div><textarea
id="ideaInput"
placeholder="مثال: برج على شكل ذرة"
></textarea><button
type="button"
id="analyzeButton"

«»

🚀 حلّل الفكرة
</button>

<div
id="ideaResult"
class="result"
></div></div></div><script>

document
.getElementById("analyzeButton")
.addEventListener("click", function(){

var idea =
document
.getElementById("ideaInput")
.value
.trim();

var result =
document
.getElementById("ideaResult");

if(idea === ""){

result.style.display="block";

result.innerHTML=
"⚠️ اكتب فكرة المشروع أولًا.";

return;

}

var text =
idea.toLowerCase();

if(
text.includes("ذرة") ||
text.includes("ذره")
){

result.innerHTML=

"<h3>🏗️ تحليل فكرة المشروع</h3>" +

"<div class='success'>تم تحليل الفكرة بنجاح ✅</div>" +

"<br>" +

"<strong>🏷️ اسم المشروع:</strong><br>" +
"KAPO ATOM | برج كابو الذري" +

"<br><br>" +

"<strong>💡 الفكرة المعمارية:</strong><br>" +
"برج مستقبلي مستوحى من شكل الذرة، " +
"بحيث تمثل النواة مركز البرج، " +
"وتتوزع الكتل المعمارية حولها بطريقة ديناميكية." +

"<br><br>" +

"<strong>🏢 الاستخدامات المقترحة:</strong><br>" +
"فندق، مكاتب، شقق فندقية، مطاعم، " +
"منصة مشاهدة ومساحات للفعاليات." +

"<br><br>" +

"<strong>🌟 المميزات:</strong><br>" +
"شكل معماري مميز، واجهات ديناميكية، " +
"إضاءة ليلية، ومساحات متعددة الاستخدام." +

"<br><br>" +

"<strong>📌 فكرتك:</strong><br>" +
idea;

}else{

result.innerHTML=

"<h3>🏗️ تحليل فكرة المشروع</h3>" +

"<div class='success'>تم استلام فكرتك بنجاح ✅</div>" +

"<br>" +

"<strong>📌 الفكرة التي أدخلتها:</strong><br>" +
idea +

"<br><br>" +

"<strong>💡 التصور الأولي:</strong><br>" +
"يمكن تطوير هذه الفكرة إلى مشروع معماري متكامل " +
"من خلال تحديد الاستخدام، الارتفاع، المساحات، " +
"الشكل الخارجي والمكونات الهندسية.";

}

result.style.display="block";

result.scrollIntoView({
behavior:"smooth",
block:"start"
});

});

</script></body>
</html>
